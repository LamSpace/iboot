# 持续集成：分层执行回归检查
#
# - PR：路由覆盖 + 构建 + 网关单元测试（不依赖全栈，几分钟内完成）
# - 定时 / 手动：构建后由 scripts/dev-init.sh 拉起中间件、db-init、九个业务服务与网关，
#   再跑 scripts/regress/regress.sh
#
# 路由覆盖只需读取 golden 快照与 routes.txt，是静态检查，因此前移到 PR；
# 契约快照本身要连接运行中的服务，无法在 PR 阶段完成，仍放在全栈任务里。

name: regress

on:
  pull_request:
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build:
    name: 构建与网关测试
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 路由覆盖（静态）
        run: bash scripts/regress/route-coverage.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 构建全部模块（跳过测试）
        run: mvn -B -DskipTests package

      - name: 网关集成测试
        run: mvn -B -pl iboot-gateway test

  full-regress:
    name: 全栈回归
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 构建全部模块（跳过测试）
        run: mvn -B -DskipTests package

      - name: 启动全栈（中间件 + db-init + 九个业务服务 + 网关）
        env:
          # AI 启动校验要求 key 非空；回归不调用真实模型，用占位值即可。
          DASHSCOPE_CHAT_API_KEY: ci-placeholder
          DASHSCOPE_EMBEDDING_API_KEY: ci-placeholder
          # 回归不覆盖运维控制台；关闭以节省 runner 内存。
          IBOOT_OPS_ENABLED: 'false'
          # 不依赖 Tempo；备份链路由冒烟覆盖。
          IBOOT_TRACING_ENABLED: 'false'
          IBOOT_BACKUP_ENABLED: 'true'
          IBOOT_BACKUP_ENCRYPTION_KEY: 'ci-only-key-do-not-use-in-prod'
          # mail host 为空时，默认 health 指标会把服务拉成 DOWN。
          MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
          # 九个服务同时运行，限制堆避免超出标准 runner 内存。
          JAVA_TOOL_OPTIONS: '-Xms128m -Xmx384m'
        run: bash scripts/dev-init.sh

      - name: 回归检查
        run: bash scripts/regress/regress.sh

      - name: 失败时输出日志
        if: failure()
        run: |
          echo '===== 后端日志 ====='
          tail -100 logs/*.log 2>/dev/null || true
          echo '===== 中间件状态 ====='
          docker compose -f docker/docker-compose.yml --profile platform ps || true
          docker compose -f docker/docker-compose.yml --profile platform logs --tail=100 mysql redis minio elasticsearch nacos 2>/dev/null || true
