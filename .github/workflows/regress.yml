# 持续集成：分层执行回归检查
#
# - PR：路由覆盖 + 构建 + 网关单元测试（不依赖全栈，几分钟内完成）
# - 定时 / 手动：构建后由 scripts/dev-init.sh 拉起中间件、db-init、九个业务服务与网关，
#   再跑 scripts/regress/regress.sh
#
# 路由覆盖只需读取 golden 快照与 routes.txt，是静态检查，因此前移到 PR；
# 契约快照本身要连接运行中的服务，无法在 PR 阶段完成，仍放在全栈任务里。

name: regress

on:
  pull_request:
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build:
    name: 构建与网关测试
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 路由覆盖（静态）
        run: bash scripts/regress/route-coverage.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 下一步用 -pl 把 Reactor 裁剪到网关，兄弟模块必须已安装到本地仓库。
      - name: 构建并安装全部模块（跳过测试）
        run: mvn -B -DskipTests install

      - name: 网关集成测试
        timeout-minutes: 8
        run: mvn -B -pl iboot-gateway test

      - name: 开发者 CLI 单元测试
        timeout-minutes: 5
        run: mvn -B -pl iboot-cli test

  full-regress:
    name: 全栈回归
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 安装 cnpm 与 mkcert
        run: |
          npm install -g cnpm --registry=https://registry.npmmirror.com
          GOBIN="$HOME/go/bin" go install filippo.io/mkcert@v1.4.4
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: 构建全部模块（跳过测试）
        run: mvn -B -DskipTests package

      - name: 启动全栈（中间件 + db-init + 九个业务服务 + 网关 + HTTPS 门户）
        env:
          # 公开入口 TLS；证书由 dev-init.sh 调用 tls-init.sh 生成
          IBOOT_TLS_ENABLED: 'true'
          IBOOT_INTERNAL_TLS_ENABLED: 'true'
          IBOOT_PUBLIC_ORIGIN: 'https://localhost:5173'
          IBOOT_CLI_TRUSTSTORE: ${{ github.workspace }}/docker/certs/truststore.p12
          REG_CACERT: ${{ github.workspace }}/docker/certs/ca/rootCA.pem
          # AI 启动校验要求 key 非空；回归不调用真实模型，用占位值即可。
          DASHSCOPE_CHAT_API_KEY: ci-placeholder
          DASHSCOPE_EMBEDDING_API_KEY: ci-placeholder
          # 与 .env.example 的开发默认值一致；关闭会使 /api/ai/agent/** 不注册，契约快照漂移。
          IBOOT_AI_AGENT_ENABLED: 'true'
          # 回归不覆盖运维控制台；关闭以节省 runner 内存。
          IBOOT_OPS_ENABLED: 'false'
          # 不依赖 Tempo；备份链路由冒烟覆盖。
          IBOOT_TRACING_ENABLED: 'false'
          IBOOT_BACKUP_ENABLED: 'true'
          # 必须是 Base64 编码的 32 字节密钥，否则 iboot-job 启动时校验失败直接退出。
          IBOOT_BACKUP_ENCRYPTION_KEY: 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
          # ES 只接受 HTTPS + 认证；Kibana 9.5 不能使用 elastic 超级用户。
          ELASTIC_PASSWORD: iboot-dev-elastic
          ES_AI_PASSWORD: iboot-dev-es-ai
          ES_NOTIFY_PASSWORD: iboot-dev-es-notify
          ES_MONITOR_PASSWORD: iboot-dev-es-monitor
          ES_LOGSTASH_PASSWORD: iboot-dev-es-logstash
          ES_GRAFANA_PASSWORD: iboot-dev-es-grafana
          ES_EXPORTER_PASSWORD: iboot-dev-es-exporter
          KIBANA_SYSTEM_PASSWORD: iboot-dev-kibana
          GRAFANA_ADMIN_PASSWORD: iboot-dev-grafana
          NEO4J_PASSWORD: iboot-dev-neo4j
          # 中间件账号鉴权：CI 在干净环境使用独立开发口令。
          MYSQL_ROOT_PASSWORD: root
          MYSQL_MIGRATOR_PASSWORD: iboot-dev-migrator
          MYSQL_PROVISIONER_PASSWORD: iboot-dev-provisioner
          MYSQL_EXPORTER_PASSWORD: iboot-dev-exporter
          REDIS_EXPORTER_PASSWORD: iboot-dev-redis-exporter
          MYSQL_SYSTEM_PASSWORD: iboot-dev-mysql-system
          MYSQL_WORKFLOW_PASSWORD: iboot-dev-mysql-workflow
          MYSQL_FILE_PASSWORD: iboot-dev-mysql-file
          MYSQL_NOTIFY_PASSWORD: iboot-dev-mysql-notify
          MYSQL_JOB_PASSWORD: iboot-dev-mysql-job
          MYSQL_MONITOR_PASSWORD: iboot-dev-mysql-monitor
          MYSQL_AUTH_PASSWORD: iboot-dev-mysql-auth
          MYSQL_AI_PASSWORD: iboot-dev-mysql-ai
          REDIS_SYSTEM_PASSWORD: iboot-dev-redis-system
          REDIS_WORKFLOW_PASSWORD: iboot-dev-redis-workflow
          REDIS_FILE_PASSWORD: iboot-dev-redis-file
          REDIS_NOTIFY_PASSWORD: iboot-dev-redis-notify
          REDIS_JOB_PASSWORD: iboot-dev-redis-job
          REDIS_MONITOR_PASSWORD: iboot-dev-redis-monitor
          REDIS_AUTH_PASSWORD: iboot-dev-redis-auth
          REDIS_AI_PASSWORD: iboot-dev-redis-ai
          NACOS_SYSTEM_PASSWORD: iboot-dev-nacos-system
          NACOS_WORKFLOW_PASSWORD: iboot-dev-nacos-workflow
          NACOS_FILE_PASSWORD: iboot-dev-nacos-file
          NACOS_NOTIFY_PASSWORD: iboot-dev-nacos-notify
          NACOS_JOB_PASSWORD: iboot-dev-nacos-job
          NACOS_MONITOR_PASSWORD: iboot-dev-nacos-monitor
          NACOS_AUTH_PASSWORD: iboot-dev-nacos-auth
          NACOS_AI_PASSWORD: iboot-dev-nacos-ai
          NACOS_GATEWAY_PASSWORD: iboot-dev-nacos-gateway
          NACOS_OPS_PASSWORD: iboot-dev-nacos-ops
          KAFKA_BROKER_PASSWORD: iboot-dev-kafka-broker
          KAFKA_LOG_PASSWORD: iboot-dev-kafka-log
          KAFKA_LOGSTASH_PASSWORD: iboot-dev-kafka-logstash
          KAFKA_TOOLS_PASSWORD: iboot-dev-kafka-tools
          SILO_ROOT_USER: ibootadmin
          SILO_ROOT_PASSWORD: iboot-dev-silo
          SILO_FILE_ACCESS_KEY: iboot_file
          SILO_FILE_SECRET_KEY: iboot-dev-file-silo
          SILO_JOB_ACCESS_KEY: iboot_job
          SILO_JOB_SECRET_KEY: iboot-dev-job-silo
          SILO_AI_ACCESS_KEY: iboot_ai
          SILO_AI_SECRET_KEY: iboot-dev-ai-silo
          ROCKETMQ_ADMIN_ACCESS_KEY: iboot_rocketmq
          ROCKETMQ_ADMIN_SECRET_KEY: iboot-dev-rocketmq-admin
          ROCKETMQ_WORKFLOW_ACCESS_KEY: iboot_workflow
          ROCKETMQ_WORKFLOW_SECRET_KEY: iboot-dev-rocketmq-workflow
          ROCKETMQ_NOTIFY_ACCESS_KEY: iboot_notify
          ROCKETMQ_NOTIFY_SECRET_KEY: iboot-dev-rocketmq-notify
          NACOS_SERVER_ADDR: https://localhost:8848
          NACOS_USERNAME: iboot
          NACOS_PASSWORD: iboot-dev-nacos
          NACOS_ADMIN_PASSWORD: iboot-dev-nacos-admin
          NACOS_AUTH_TOKEN: aWJvb3QtZGV2LW5hY29zLWF1dGgtdG9rZW4tMzJieXRl
          NACOS_AUTH_IDENTITY_KEY: iboot
          NACOS_AUTH_IDENTITY_VALUE: iboot
          # mail host 为空时，默认 health 指标会把服务拉成 DOWN。
          MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
          # 九个服务同时运行，限制堆避免超出标准 runner 内存。
          JAVA_TOOL_OPTIONS: '-Xms128m -Xmx384m'
        run: bash scripts/dev-init.sh --frontend

      - name: 回归检查
        env:
          REG_BASE: https://localhost:5173
          REG_AI_BASE: https://localhost:5173
          REG_AUTH_BASE: https://localhost:5173
          REG_GATEWAY: https://localhost:5173
          REG_OIDC_REDIRECT: https://localhost:5173/callback
          REG_CACERT: ${{ github.workspace }}/docker/certs/ca/rootCA.pem
          ELASTIC_PASSWORD: iboot-dev-elastic
          ES_AI_PASSWORD: iboot-dev-es-ai
          ES_NOTIFY_PASSWORD: iboot-dev-es-notify
          ES_MONITOR_PASSWORD: iboot-dev-es-monitor
          ES_LOGSTASH_PASSWORD: iboot-dev-es-logstash
          ES_GRAFANA_PASSWORD: iboot-dev-es-grafana
          ES_EXPORTER_PASSWORD: iboot-dev-es-exporter
          NEO4J_PASSWORD: iboot-dev-neo4j
          GRAFANA_ADMIN_PASSWORD: iboot-dev-grafana
          KIBANA_SYSTEM_PASSWORD: iboot-dev-kibana
          IBOOT_SERVICE_AUTHORIZATION_OPA_URL: http://localhost:8181
          # 与启动步骤一致：CI 使用同一组中间件账号。
          MYSQL_ROOT_PASSWORD: root
          MYSQL_MIGRATOR_PASSWORD: iboot-dev-migrator
          MYSQL_PROVISIONER_PASSWORD: iboot-dev-provisioner
          MYSQL_EXPORTER_PASSWORD: iboot-dev-exporter
          REDIS_EXPORTER_PASSWORD: iboot-dev-redis-exporter
          MYSQL_SYSTEM_PASSWORD: iboot-dev-mysql-system
          MYSQL_WORKFLOW_PASSWORD: iboot-dev-mysql-workflow
          MYSQL_FILE_PASSWORD: iboot-dev-mysql-file
          MYSQL_NOTIFY_PASSWORD: iboot-dev-mysql-notify
          MYSQL_JOB_PASSWORD: iboot-dev-mysql-job
          MYSQL_MONITOR_PASSWORD: iboot-dev-mysql-monitor
          MYSQL_AUTH_PASSWORD: iboot-dev-mysql-auth
          MYSQL_AI_PASSWORD: iboot-dev-mysql-ai
          REDIS_SYSTEM_PASSWORD: iboot-dev-redis-system
          REDIS_WORKFLOW_PASSWORD: iboot-dev-redis-workflow
          REDIS_FILE_PASSWORD: iboot-dev-redis-file
          REDIS_NOTIFY_PASSWORD: iboot-dev-redis-notify
          REDIS_JOB_PASSWORD: iboot-dev-redis-job
          REDIS_MONITOR_PASSWORD: iboot-dev-redis-monitor
          REDIS_AUTH_PASSWORD: iboot-dev-redis-auth
          REDIS_AI_PASSWORD: iboot-dev-redis-ai
          NACOS_SYSTEM_PASSWORD: iboot-dev-nacos-system
          NACOS_WORKFLOW_PASSWORD: iboot-dev-nacos-workflow
          NACOS_FILE_PASSWORD: iboot-dev-nacos-file
          NACOS_NOTIFY_PASSWORD: iboot-dev-nacos-notify
          NACOS_JOB_PASSWORD: iboot-dev-nacos-job
          NACOS_MONITOR_PASSWORD: iboot-dev-nacos-monitor
          NACOS_AUTH_PASSWORD: iboot-dev-nacos-auth
          NACOS_AI_PASSWORD: iboot-dev-nacos-ai
          NACOS_GATEWAY_PASSWORD: iboot-dev-nacos-gateway
          NACOS_OPS_PASSWORD: iboot-dev-nacos-ops
          KAFKA_BROKER_PASSWORD: iboot-dev-kafka-broker
          KAFKA_LOG_PASSWORD: iboot-dev-kafka-log
          KAFKA_LOGSTASH_PASSWORD: iboot-dev-kafka-logstash
          KAFKA_TOOLS_PASSWORD: iboot-dev-kafka-tools
          SILO_ROOT_USER: ibootadmin
          SILO_ROOT_PASSWORD: iboot-dev-silo
          SILO_FILE_ACCESS_KEY: iboot_file
          SILO_FILE_SECRET_KEY: iboot-dev-file-silo
          SILO_JOB_ACCESS_KEY: iboot_job
          SILO_JOB_SECRET_KEY: iboot-dev-job-silo
          SILO_AI_ACCESS_KEY: iboot_ai
          SILO_AI_SECRET_KEY: iboot-dev-ai-silo
          ROCKETMQ_ADMIN_ACCESS_KEY: iboot_rocketmq
          ROCKETMQ_ADMIN_SECRET_KEY: iboot-dev-rocketmq-admin
          ROCKETMQ_WORKFLOW_ACCESS_KEY: iboot_workflow
          ROCKETMQ_WORKFLOW_SECRET_KEY: iboot-dev-rocketmq-workflow
          ROCKETMQ_NOTIFY_ACCESS_KEY: iboot_notify
          ROCKETMQ_NOTIFY_SECRET_KEY: iboot-dev-rocketmq-notify
          NACOS_SERVER_ADDR: https://localhost:8848
          NACOS_USERNAME: iboot
          NACOS_PASSWORD: iboot-dev-nacos
          NACOS_ADMIN_PASSWORD: iboot-dev-nacos-admin
          NACOS_AUTH_TOKEN: aWJvb3QtZGV2LW5hY29zLWF1dGgtdG9rZW4tMzJieXRl
          NACOS_AUTH_IDENTITY_KEY: iboot
          NACOS_AUTH_IDENTITY_VALUE: iboot
          # 与启动步骤一致：CI 不启动 iboot-ops，内部 TLS 不再检查 8089。
          IBOOT_OPS_ENABLED: 'false'
        run: bash scripts/regress/regress.sh

      - name: TLS 公开入口检查
        env:
          REG_BASE: https://localhost:5173
          REG_AUTH_BASE: https://localhost:5173
          REG_OIDC_REDIRECT: https://localhost:5173/callback
          REG_CACERT: ${{ github.workspace }}/docker/certs/ca/rootCA.pem
        run: bash scripts/regress/tls.sh

      - name: 开发者 CLI 回归
        timeout-minutes: 10
        env:
          REG_BASE: https://localhost:5173
          REG_AUTH_BASE: https://localhost:5173
          REG_GATEWAY: https://localhost:5173
          REG_OIDC_REDIRECT: https://localhost:5173/callback
          REG_CACERT: ${{ github.workspace }}/docker/certs/ca/rootCA.pem
          IBOOT_CLI_TRUSTSTORE: ${{ github.workspace }}/docker/certs/truststore.p12
        run: bash scripts/regress/cli.sh

      - name: 失败时输出日志
        if: failure()
        run: |
          echo '===== 后端日志 ====='
          ls -la logs/ 2>/dev/null || true
          for f in logs/*.log; do
            echo "===== $f ====="
            tail -c 20000 "$f" 2>/dev/null || true
          done
          echo '===== 中间件状态 ====='
          # 失败步骤没有 compose 插值所需的全部环境变量，直接用 docker 取状态与日志。
          docker ps -a --format '{{.Names}}\t{{.Status}}' || true
          for c in iboot-mysql iboot-redis iboot-silo iboot-elasticsearch iboot-nacos; do
            echo "===== $c ====="
            docker logs --tail 100 "$c" 2>&1 || true
          done

      # 快照与 diff 是契约漂移的唯一完整证据，失败时下载后可直接刷新 golden 基线。
      - name: 上传回归快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-snapshots
          path: scripts/regress/.tmp
          # 快照目录以点开头，默认会被 upload-artifact 当作隐藏文件跳过。
          include-hidden-files: true
          if-no-files-found: ignore
