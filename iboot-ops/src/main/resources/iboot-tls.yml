# 共享 TLS 配置：服务端证书与客户端信任链。
#
# 由各服务通过 spring.config.import: classpath:iboot-tls.yml 引入。
# 证书目录由 IBOOT_TLS_CERT_DIR 指定：宿主机开发为 <repo>/docker/certs，
# 容器内为 /certs。未设置时回落到 docker/certs，便于直接运行 jar。
spring:
  http:
    clients:
      ssl:
        bundle: iboot
  elasticsearch:
    restclient:
      ssl:
        bundle: iboot
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
  ssl:
    bundle:
      pem:
        iboot:
          keystore:
            certificate: file:${IBOOT_TLS_CERT_FILE:${IBOOT_TLS_CERT_DIR:docker/certs}/portal.pem}
            private-key: file:${IBOOT_TLS_KEY_FILE:${IBOOT_TLS_CERT_DIR:docker/certs}/portal-key.pem}
          truststore:
            certificate: file:${IBOOT_TLS_CERT_DIR:docker/certs}/ca/rootCA.pem
server:
  ssl:
    bundle: iboot
    # 服务间 mTLS：只接受由本地 CA 签发的客户端证书。
    client-auth: need

# 服务间授权：mTLS 证明调用方身份后，按证书 CN 限制可访问的路径。
# 默认关闭以保护单元测试；Docker 全栈与 dev-init 显式启用。
iboot:
  security:
    service-authorization:
      enabled: ${IBOOT_SERVICE_AUTHORIZATION_ENABLED:false}
      rules:
        - paths: ["/actuator/**"]
          callers: ["iboot-ops", "prometheus", "blackbox", "iboot-portal"]
        - paths: ["/oauth2/jwks"]
          callers: ["iboot-system", "iboot-ai", "iboot-file", "iboot-auth", "iboot-notify",
                    "iboot-job", "iboot-workflow", "iboot-monitor", "iboot-gateway", "iboot-portal"]
        - paths: ["/oauth2/**", "/.well-known/**", "/login", "/connect/**"]
          callers: ["iboot-gateway", "iboot-portal"]
        - paths: ["/sba/**", "/instances/**", "/applications/**"]
          callers: ["iboot-portal"]
        - paths: ["/druid/**", "/swagger-ui/**", "/swagger-ui.html", "/v3/api-docs/**",
                  "/v3/api-docs", "/v3/api-docs.yaml", "/swagger-resources/**", "/webjars/**", "/doc.html"]
          callers: ["iboot-portal"]
