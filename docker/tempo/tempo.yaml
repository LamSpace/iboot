# Tempo 单机配置（阶段 2 链路追踪后端）
#
# 只做两件事：接收 OTLP、落到本地磁盘。指标生成、集群等能力在本地开发用不到，不开启。
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  # 查询端口只提供 TLS；证书由编排挂载到 /certs。
  http_tls_config:
    cert_file: /certs/portal.pem
    key_file: /certs/portal-key.pem
  # 9095 是 Tempo 进程内 frontend↔querier 的 gRPC 端口，不发布到宿主机；
  # 开启 grpc_tls_config 会打断内部调用，故保持明文并作为已登记边界。

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          tls:
            cert_file: /certs/portal.pem
            key_file: /certs/portal-key.pem
        http:
          endpoint: 0.0.0.0:4318
          tls:
            cert_file: /certs/portal.pem
            key_file: /certs/portal-key.pem

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
