server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/run/spire/server/api.sock"
    trust_domain = "iboot.local"
    data_dir = "/run/spire/data"
    log_level = "INFO"
    ca_subject = {
        country = ["CN"]
        organization = ["iBoot"]
        common_name = "iBoot SPIRE CA"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/keys.json"
        }
    }
    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/run/spire/ca/ca.crt"
            key_file_path = "/run/spire/ca/ca.key"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
