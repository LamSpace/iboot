  #   build:
  #     context: ../iboot-admin
  #     dockerfile: Dockerfile
  #   container_name: iboot-admin
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - TZ=Asia/Shanghai
  #     - SPRING_PROFILES_ACTIVE=docker
  #     # 数据库配置（使用简单变量名，与 application.yml 占位符对应）
