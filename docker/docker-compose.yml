# iBoot 全栈 Docker Compose 编排
#
# 构建前置：
#   scripts/docker-deploy.sh 会先构建共享 builder 镜像 iboot-backend-builder:local，
#   再执行 docker compose build。单独执行 docker compose build 前必须先完成这一步。
#
# 常用命令：
#   docker compose -f docker/docker-compose.yml up -d --wait
#   docker compose -f docker/docker-compose.yml --profile observability --profile graph up -d --wait

x-app-env: &app-env
  TZ: Asia/Shanghai
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  # 每服务身份由各服务块覆盖；默认清空，避免继承 env_file 中的共享或其它服务凭据。
  MYSQL_USERNAME: ""
  MYSQL_PASSWORD: ""
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_USERNAME: ""
  REDIS_PASSWORD: ""
  # 业务服务只保留自身 Redis 账号；exporter 口令不进入业务容器。
  REDIS_EXPORTER_PASSWORD: ""
  # .env 会整文件进入容器；显式清空所有每服务口令，各服务只填自己的那一组。
  MIDDLEWARE_SYSTEM_PASSWORD: ""
  MIDDLEWARE_WORKFLOW_PASSWORD: ""
  MIDDLEWARE_FILE_PASSWORD: ""
  MIDDLEWARE_NOTIFY_PASSWORD: ""
  MIDDLEWARE_JOB_PASSWORD: ""
  MIDDLEWARE_MONITOR_PASSWORD: ""
  MIDDLEWARE_AUTH_PASSWORD: ""
  MIDDLEWARE_AI_PASSWORD: ""
  MIDDLEWARE_GATEWAY_PASSWORD: ""
  MIDDLEWARE_OPS_PASSWORD: ""
  SILO_FILE_ACCESS_KEY: ""
  SILO_FILE_SECRET_KEY: ""
  SILO_JOB_ACCESS_KEY: ""
  SILO_JOB_SECRET_KEY: ""
  SILO_AI_ACCESS_KEY: ""
  SILO_AI_SECRET_KEY: ""
  IBOOT_FILE_SILO_ACCESS_KEY: ""
  IBOOT_FILE_SILO_SECRET_KEY: ""
  IBOOT_AI_SILO_ACCESS_KEY: ""
  IBOOT_AI_SILO_SECRET_KEY: ""
  ELASTICSEARCH_URIS: https://elasticsearch:9200
  # 默认不注入任何 ES 凭据；使用 ES 的服务在自身 environment 中覆盖专用账号。
  ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
  ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
  # .env 会整文件进入容器；显式清空超级用户口令，避免绕过专用账号。
  ELASTIC_PASSWORD: ""
  MYSQL_ROOT_PASSWORD: ""
  MYSQL_EXPORTER_PASSWORD: ""
  SILO_ROOT_USER: ""
  SILO_ROOT_PASSWORD: ""
  NACOS_ADMIN_PASSWORD: ""
  # 各服务只保留自己的 ES 口令，其余账号口令不进入业务容器。
  ES_AI_PASSWORD: ""
  ES_NOTIFY_PASSWORD: ""
  ES_MONITOR_PASSWORD: ""
  ES_LOGSTASH_PASSWORD: ""
  ES_GRAFANA_PASSWORD: ""
  ES_EXPORTER_PASSWORD: ""
  NACOS_ADDR: nacos:8848
  # 客户端 HTTP 鉴权登录必须走 HTTPS；gRPC 仍按端口偏移连接 9848。
  NACOS_SERVER_ADDR: https://nacos:8848
  # 每服务使用自己的 Nacos 账号，由各服务块覆盖。
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""
  SEATA_SERVER_ADDR: seata-server:8091
  IBOOT_SEATA_ENABLED: "true"
  IBOOT_SYSTEM_BASE_URL: https://iboot-system
  # 本地开发默认值；生产通过 .env 或 KMS 注入
  IBOOT_SYSTEM_INTERNAL_TOKEN: ${IBOOT_SYSTEM_INTERNAL_TOKEN:-iboot-dev-internal-token}
  SENTINEL_DASHBOARD: sentinel-dashboard:8858
  TEMPO_OTLP: https://tempo:4318/v1/traces
  IBOOT_LOGGING_KAFKA_ENABLED: "true"
  IBOOT_LOGGING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  IBOOT_LOGGING_KAFKA_SECURITY_PROTOCOL: SASL_SSL
  IBOOT_LOGGING_KAFKA_SASL_MECHANISM: PLAIN
  IBOOT_LOGGING_KAFKA_SASL_USERNAME: iboot_log
  IBOOT_LOGGING_KAFKA_SASL_PASSWORD: ${KAFKA_LOG_PASSWORD:?KAFKA_LOG_PASSWORD 必须在 .env 中设置}
  # 其余 Kafka 账号口令不进入业务容器。
  KAFKA_BROKER_PASSWORD: ""
  KAFKA_LOGSTASH_PASSWORD: ""
  KAFKA_TOOLS_PASSWORD: ""
  IBOOT_LOGGING_KAFKA_TRUSTSTORE_LOCATION: /certs/truststore.p12
  IBOOT_LOGGING_KAFKA_TRUSTSTORE_PASSWORD: changeit
  IBOOT_LOGGING_KAFKA_TRUSTSTORE_TYPE: PKCS12
  JWT_JWK_SET_URI: https://iboot-auth:8083/oauth2/jwks
  # 浏览器经门户 443 访问；认证 issuer/回调必须与公开来源一致
  IBOOT_AUTH_ISSUER: https://localhost
  IBOOT_AUTH_REDIRECT_URI: https://localhost/callback
  IBOOT_AUTH_LOGOUT_REDIRECT_URI: https://localhost/login
  IBOOT_AUTH_COOKIE_SECURE: "true"
  IBOOT_NOTIFY_BASE_URL: https://iboot-notify:8084
  # 内部 TLS：证书目录与 JVM 信任库（Druid/MinIO/Neo4j 等非 Spring 客户端也使用）
  IBOOT_TLS_CERT_DIR: /certs
  IBOOT_INTERNAL_TLS_ENABLED: "true"
  # 服务间授权：mTLS 身份 + 路径级调用方白名单
  IBOOT_SERVICE_AUTHORIZATION_ENABLED: "true"
  JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12 -Dnacos.remote.client.rpc.tls.enable=true -Dnacos.remote.client.rpc.tls.trustCollectionChainPath=file:/certs/ca/rootCA.pem -Dnacos.remote.client.rpc.tls.trustAll=false -Dnacos.remote.client.rpc.tls.mutualAuth=true -Dnacos.remote.client.rpc.tls.certChainFile=file:/certs/portal.pem -Dnacos.remote.client.rpc.tls.certPrivateKey=file:/certs/portal-key.pem"
  IBOOT_ROCKETMQ_ENDPOINTS: rocketmq-tls:8081
  IBOOT_ROCKETMQ_SSL_ENABLED: "true"
  IBOOT_AI_SILO_ENDPOINT: https://silo:9000
  # 文件与 AI 的 Silo 服务账号由各自服务块注入；根账号不进入业务服务。
  # 文件存储默认走 Silo；容器内用服务名读写，预签名地址用浏览器可达的宿主机地址
  IBOOT_FILE_STORAGE_TYPE: silo
  IBOOT_FILE_SILO_ENDPOINT: https://silo:9000
  IBOOT_FILE_SILO_PUBLIC_ENDPOINT: ${IBOOT_FILE_SILO_PUBLIC_ENDPOINT:-https://localhost:9000}
  IBOOT_AI_GRAPH_URI: bolt+s://neo4j:7687
  # 图数据库与 Neo4j 服务端共用同一组受管口令；缺失时编排直接失败。
  IBOOT_AI_GRAPH_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD 必须在 .env 中设置}
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

x-app-common: &app-common
  env_file:
    - ../.env
  restart: unless-stopped
  networks:
    - app
    - data

x-app-healthcheck: &app-healthcheck
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 90s

x-backend-build: &backend-build
  context: ..
  dockerfile: docker/Dockerfile.backend

services:
  # ==================== 构建阶段 ====================
  # 只作为构建目标，不会常驻；由 scripts/docker-deploy.sh 先构建。
  iboot-backend-builder:
    image: iboot-backend-builder:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend-builder
    profiles: ["build"]

  # ==================== 数据库初始化 ====================
  db-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dbinit
    container_name: iboot-db-init
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      # 迁移需要 DDL，使用 root；业务服务使用 iboot_app。
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须在 .env 中设置}
      IBOOT_DB_NAME: iboot
      MYSQL_TLS_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12"
    volumes:
      - ./certs/runtime:/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
      mysql-users-init:
        condition: service_completed_successfully
      nacos-init:
        condition: service_completed_successfully
      es-users-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - data

  # 幂等创建 MySQL 业务账号与 exporter 账号；db-init 与业务服务依赖它完成。
  mysql-users-init:
    image: mysql:8.4.13
    container_name: iboot-mysql-users-init
    entrypoint: ["/bin/bash", "/scripts/mysql-users-init.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须在 .env 中设置}
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:-iboot_exporter}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_SYSTEM_PASSWORD: ${MIDDLEWARE_SYSTEM_PASSWORD:?MIDDLEWARE_SYSTEM_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_WORKFLOW_PASSWORD: ${MIDDLEWARE_WORKFLOW_PASSWORD:?MIDDLEWARE_WORKFLOW_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_FILE_PASSWORD: ${MIDDLEWARE_FILE_PASSWORD:?MIDDLEWARE_FILE_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_NOTIFY_PASSWORD: ${MIDDLEWARE_NOTIFY_PASSWORD:?MIDDLEWARE_NOTIFY_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_JOB_PASSWORD: ${MIDDLEWARE_JOB_PASSWORD:?MIDDLEWARE_JOB_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_MONITOR_PASSWORD: ${MIDDLEWARE_MONITOR_PASSWORD:?MIDDLEWARE_MONITOR_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_AUTH_PASSWORD: ${MIDDLEWARE_AUTH_PASSWORD:?MIDDLEWARE_AUTH_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_AI_PASSWORD: ${MIDDLEWARE_AI_PASSWORD:?MIDDLEWARE_AI_PASSWORD 必须在 .env 中设置}
    volumes:
      - ../scripts/mysql-users-init.sh:/scripts/mysql-users-init.sh:ro
      - ./certs/runtime:/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  # ==================== 应用服务 ====================
  iboot-system:
    <<: *app-common
    container_name: iboot-system
    build:
      <<: *backend-build
      args:
        MODULE: iboot-system
        PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *app-env
      MYSQL_USERNAME: "iboot_system"
      MYSQL_PASSWORD: ${MIDDLEWARE_SYSTEM_PASSWORD:?MIDDLEWARE_SYSTEM_PASSWORD 必须在 .env 中设置}
      REDIS_USERNAME: "iboot_system"
      REDIS_PASSWORD: ${MIDDLEWARE_SYSTEM_PASSWORD:?MIDDLEWARE_SYSTEM_PASSWORD 必须在 .env 中设置}
      NACOS_USERNAME: "iboot_system"
      NACOS_PASSWORD: ${MIDDLEWARE_SYSTEM_PASSWORD:?MIDDLEWARE_SYSTEM_PASSWORD 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-system.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-system-key.pem
      # 系统服务不再承载文件上传；遗留存储策略切到本地，避免占用 Silo 服务账号。
      IBOOT_FILE_STORAGE_TYPE: local
      JAVA_OPTIONS: "-Xms512m -Xmx1024m --enable-native-access=ALL-UNNAMED"
      # 门户 nginx 不代理 Nacos 控制台，容器部署固定为跳转模式；地址取浏览器可达的宿主机端口。
      # 这两个环境变量覆盖 sys_config 中的开发默认值，宿主机 Vite 开发不受影响。
      SYS_NACOS_CONSOLE_URL: ${SYS_NACOS_CONSOLE_URL:-https://localhost:8849}
      SYS_NACOS_CONSOLE_EMBED: ${SYS_NACOS_CONSOLE_EMBED:-false}
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
      - uploads_data:/app/uploads
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      start_period: 120s
    networks:
      - edge
      - app
      - data
      - tx
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      silo:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-ai:
    <<: *app-common
    container_name: iboot-ai
    build:
      <<: *backend-build
      args:
        MODULE: iboot-ai
        PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *app-env
      MYSQL_USERNAME: "iboot_ai"
      MYSQL_PASSWORD: ${MIDDLEWARE_AI_PASSWORD:?MIDDLEWARE_AI_PASSWORD 必须在 .env 中设置}
      REDIS_USERNAME: "iboot_ai"
      REDIS_PASSWORD: ${MIDDLEWARE_AI_PASSWORD:?MIDDLEWARE_AI_PASSWORD 必须在 .env 中设置}
      NACOS_USERNAME: "iboot_ai"
      NACOS_PASSWORD: ${MIDDLEWARE_AI_PASSWORD:?MIDDLEWARE_AI_PASSWORD 必须在 .env 中设置}
      IBOOT_AI_SILO_ACCESS_KEY: ${SILO_AI_ACCESS_KEY:?SILO_AI_ACCESS_KEY 必须在 .env 中设置}
      IBOOT_AI_SILO_SECRET_KEY: ${SILO_AI_SECRET_KEY:?SILO_AI_SECRET_KEY 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-ai.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-ai-key.pem
      JAVA_OPTIONS: "-Xms512m -Xmx1024m --enable-native-access=ALL-UNNAMED"
      # 开启智能体与智能体管理页面所需的控制器
      IBOOT_AI_AGENT_ENABLED: "true"
      ELASTICSEARCH_USERNAME: iboot_ai
      ELASTICSEARCH_PASSWORD: ${ES_AI_PASSWORD:?ES_AI_PASSWORD 必须在 .env 中设置}
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      start_period: 150s
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      silo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-file:
    <<: *app-common
    container_name: iboot-file
    build:
      <<: *backend-build
      args:
        MODULE: iboot-file
        PORT: "8082"
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *app-env
      MYSQL_USERNAME: "iboot_file"
      MYSQL_PASSWORD: ${MIDDLEWARE_FILE_PASSWORD:?MIDDLEWARE_FILE_PASSWORD 必须在 .env 中设置}
      REDIS_USERNAME: "iboot_file"
      REDIS_PASSWORD: ${MIDDLEWARE_FILE_PASSWORD:?MIDDLEWARE_FILE_PASSWORD 必须在 .env 中设置}
      NACOS_USERNAME: "iboot_file"
      NACOS_PASSWORD: ${MIDDLEWARE_FILE_PASSWORD:?MIDDLEWARE_FILE_PASSWORD 必须在 .env 中设置}
      IBOOT_FILE_SILO_ACCESS_KEY: ${SILO_FILE_ACCESS_KEY:?SILO_FILE_ACCESS_KEY 必须在 .env 中设置}
      IBOOT_FILE_SILO_SECRET_KEY: ${SILO_FILE_SECRET_KEY:?SILO_FILE_SECRET_KEY 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-file.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-file-key.pem
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
      - uploads_data:/app/uploads
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      silo:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-auth:
    <<: *app-common
    container_name: iboot-auth
    build:
      <<: *backend-build
      args:
        MODULE: iboot-auth
        PORT: "8083"
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: *app-env
      MYSQL_USERNAME: "iboot_auth"
      MYSQL_PASSWORD: ${MIDDLEWARE_AUTH_PASSWORD:?MIDDLEWARE_AUTH_PASSWORD 必须在 .env 中设置}
      REDIS_USERNAME: "iboot_auth"
      REDIS_PASSWORD: ${MIDDLEWARE_AUTH_PASSWORD:?MIDDLEWARE_AUTH_PASSWORD 必须在 .env 中设置}
      NACOS_USERNAME: "iboot_auth"
      NACOS_PASSWORD: ${MIDDLEWARE_AUTH_PASSWORD:?MIDDLEWARE_AUTH_PASSWORD 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-auth.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-auth-key.pem
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      # 持久化签名密钥：认证服务重启后仍能验证此前签发的令牌
      IBOOT_AUTH_JWK_FILE: /app/keys/iboot-auth-jwk.json
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
      - auth_keys:/app/keys
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-notify:
    <<: *app-common
    container_name: iboot-notify
    build:
      <<: *backend-build
      args:
        MODULE: iboot-notify
        PORT: "8084"
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      <<: *app-env
      MYSQL_USERNAME: "iboot_notify"
      MYSQL_PASSWORD: ${MIDDLEWARE_NOTIFY_PASSWORD:?MIDDLEWARE_NOTIFY_PASSWORD 必须在 .env 中设置}
      REDIS_USERNAME: "iboot_notify"
      REDIS_PASSWORD: ${MIDDLEWARE_NOTIFY_PASSWORD:?MIDDLEWARE_NOTIFY_PASSWORD 必须在 .env 中设置}
      NACOS_USERNAME: "iboot_notify"
      NACOS_PASSWORD: ${MIDDLEWARE_NOTIFY_PASSWORD:?MIDDLEWARE_NOTIFY_PASSWORD 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-notify.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-notify-key.pem
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      ELASTICSEARCH_USERNAME: iboot_notify
      ELASTICSEARCH_PASSWORD: ${ES_NOTIFY_PASSWORD:?ES_NOTIFY_PASSWORD 必须在 .env 中设置}
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-job:
    <<: *app-common
    container_name: iboot-job
    build:
      <<: *backend-build
      args:
        MODULE: iboot-job
        PORT: "8085"
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      <<: *app-env
      MYSQL_USERNAME: "iboot_job"
      MYSQL_PASSWORD: ${MIDDLEWARE_JOB_PASSWORD:?MIDDLEWARE_JOB_PASSWORD 必须在 .env 中设置}
      REDIS_USERNAME: "iboot_job"
      REDIS_PASSWORD: ${MIDDLEWARE_JOB_PASSWORD:?MIDDLEWARE_JOB_PASSWORD 必须在 .env 中设置}
      NACOS_USERNAME: "iboot_job"
      NACOS_PASSWORD: ${MIDDLEWARE_JOB_PASSWORD:?MIDDLEWARE_JOB_PASSWORD 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-job.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-job-key.pem
      IBOOT_FILE_SILO_ACCESS_KEY: ${SILO_JOB_ACCESS_KEY:-iboot_job}
      IBOOT_FILE_SILO_SECRET_KEY: ${SILO_JOB_SECRET_KEY:?SILO_JOB_SECRET_KEY 必须在 .env 中设置}
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      # 容器内没有 docker CLI；启用备份会触发启动自检失败
      IBOOT_BACKUP_ENABLED: "false"
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
      - uploads_data:/app/uploads
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      silo:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-workflow:
    <<: *app-common
    container_name: iboot-workflow
    build:
      <<: *backend-build
      args:
        MODULE: iboot-workflow
        PORT: "8086"
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      <<: *app-env
      MYSQL_USERNAME: "iboot_workflow"
      MYSQL_PASSWORD: ${MIDDLEWARE_WORKFLOW_PASSWORD:?MIDDLEWARE_WORKFLOW_PASSWORD 必须在 .env 中设置}
      REDIS_USERNAME: "iboot_workflow"
      REDIS_PASSWORD: ${MIDDLEWARE_WORKFLOW_PASSWORD:?MIDDLEWARE_WORKFLOW_PASSWORD 必须在 .env 中设置}
      NACOS_USERNAME: "iboot_workflow"
      NACOS_PASSWORD: ${MIDDLEWARE_WORKFLOW_PASSWORD:?MIDDLEWARE_WORKFLOW_PASSWORD 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-workflow.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-workflow-key.pem
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
    networks:
      - app
      - data
      - tx
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8086"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-monitor:
    <<: *app-common
    container_name: iboot-monitor
    build:
      <<: *backend-build
      args:
        MODULE: iboot-monitor
        PORT: "8087"
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      <<: *app-env
      MYSQL_USERNAME: "iboot_monitor"
      MYSQL_PASSWORD: ${MIDDLEWARE_MONITOR_PASSWORD:?MIDDLEWARE_MONITOR_PASSWORD 必须在 .env 中设置}
      REDIS_USERNAME: "iboot_monitor"
      REDIS_PASSWORD: ${MIDDLEWARE_MONITOR_PASSWORD:?MIDDLEWARE_MONITOR_PASSWORD 必须在 .env 中设置}
      NACOS_USERNAME: "iboot_monitor"
      NACOS_PASSWORD: ${MIDDLEWARE_MONITOR_PASSWORD:?MIDDLEWARE_MONITOR_PASSWORD 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-monitor.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-monitor-key.pem
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      ELASTICSEARCH_USERNAME: iboot_monitor
      ELASTICSEARCH_PASSWORD: ${ES_MONITOR_PASSWORD:?ES_MONITOR_PASSWORD 必须在 .env 中设置}
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-gateway:
    <<: *app-common
    container_name: iboot-gateway
    build:
      <<: *backend-build
      args:
        MODULE: iboot-gateway
        PORT: "8088"
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      <<: *app-env
      NACOS_USERNAME: "iboot_gateway"
      NACOS_PASSWORD: ${MIDDLEWARE_GATEWAY_PASSWORD:?MIDDLEWARE_GATEWAY_PASSWORD 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-gateway.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-gateway-key.pem
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      SPRING_PROFILES_ACTIVE: nacos
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088"]
      start_period: 90s
    networks:
      - edge
      - app
      - data
    depends_on:
      nacos:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-ops:
    <<: *app-common
    container_name: iboot-ops
    build:
      <<: *backend-build
      args:
        MODULE: iboot-ops
        PORT: "8089"
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      <<: *app-env
      NACOS_USERNAME: "iboot_ops"
      NACOS_PASSWORD: ${MIDDLEWARE_OPS_PASSWORD:?MIDDLEWARE_OPS_PASSWORD 必须在 .env 中设置}
      IBOOT_TLS_CERT_FILE: /certs/services/iboot-ops.pem
      IBOOT_TLS_KEY_FILE: /certs/services/iboot-ops-key.pem
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      # 本地全栈默认关闭控制台认证；生产部署必须开启并注入密码
      IBOOT_OPS_SECURITY_ENABLED: "false"
      IBOOT_OPS_USER: ops
    volumes:
      - ./certs/runtime:/certs:ro
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8089"]
    networks:
      - edge
      - app
      - data
    depends_on:
      nacos:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-portal:
    build:
      context: ../iboot-portal
      dockerfile: Dockerfile
      args:
        # Docker 公开来源；不要复用宿主机开发的 VITE_OIDC_ISSUER
        VITE_OIDC_ISSUER: ${IBOOT_PORTAL_OIDC_ISSUER:-https://localhost}
    container_name: iboot-portal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/runtime/portal.pem:/etc/nginx/certs/portal.pem:ro
      - ./certs/runtime/portal-key.pem:/etc/nginx/certs/portal-key.pem:ro
      - ./certs/runtime/rootCA.pem:/certs/rootCA.pem:ro
    environment:
      # 健康检查用同一份本地 CA 校验 HTTPS
      SSL_CERT_FILE: /certs/rootCA.pem
    depends_on:
      iboot-gateway:
        condition: service_healthy
      # nginx 启动时解析 /sba、/druid、/swagger 上游
      iboot-ops:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      # 用 IPv4 回环：nginx 只监听 IPv4，localhost 可能解析到 ::1
      test: ["CMD-SHELL", "curl -fsS --cacert /certs/rootCA.pem https://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== 基础设施 ====================
  mysql:
    image: mysql:8.4.13
    container_name: iboot-mysql
    ports:
      - "127.0.0.1:3306:3306"
    # 服务端 TLS：所有 TCP 连接都必须加密
    command: >
      --ssl-ca=/certs/rootCA.pem
      --ssl-cert=/certs/portal.pem
      --ssl-key=/certs/portal-key.pem
      --require_secure_transport=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须在 .env 中设置}
      MYSQL_DATABASE: iboot
      # root 仅用于账号初始化与迁移；业务服务使用 iboot_app
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./certs/runtime:/certs:ro
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      # 强制走 TCP 并校验服务端证书
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --ssl-mode=VERIFY_IDENTITY --ssl-ca=/certs/rootCA.pem --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8.8.4
    container_name: iboot-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      sh -c 'exec redis-server
      --port 0
      --tls-port 6379
      --tls-cert-file /certs/portal.pem
      --tls-key-file /certs/portal-key.pem
      --tls-ca-cert-file /certs/rootCA.pem
      --tls-auth-clients no
      --user default off
      --user iboot_system on ">$$MIDDLEWARE_SYSTEM_PASSWORD" "~*" "&*" "+@all"
      --user iboot_workflow on ">$$MIDDLEWARE_WORKFLOW_PASSWORD" "~*" "&*" "+@all"
      --user iboot_file on ">$$MIDDLEWARE_FILE_PASSWORD" "~*" "&*" "+@all"
      --user iboot_notify on ">$$MIDDLEWARE_NOTIFY_PASSWORD" "~*" "&*" "+@all"
      --user iboot_job on ">$$MIDDLEWARE_JOB_PASSWORD" "~*" "&*" "+@all"
      --user iboot_monitor on ">$$MIDDLEWARE_MONITOR_PASSWORD" "~*" "&*" "+@all"
      --user iboot_auth on ">$$MIDDLEWARE_AUTH_PASSWORD" "~*" "&*" "+@all"
      --user iboot_ai on ">$$MIDDLEWARE_AI_PASSWORD" "~*" "&*" "+@all"
      --user iboot_exporter on ">$$REDIS_EXPORTER_PASSWORD" "~*" "+@read" "+@connection"
      "+info" "+dbsize" "+slowlog" "+memory" "+client|list" "+config|get" "+command" "+ping" "+cluster|info" "+latency"'
    environment:
      MIDDLEWARE_SYSTEM_PASSWORD: ${MIDDLEWARE_SYSTEM_PASSWORD:?MIDDLEWARE_SYSTEM_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_WORKFLOW_PASSWORD: ${MIDDLEWARE_WORKFLOW_PASSWORD:?MIDDLEWARE_WORKFLOW_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_FILE_PASSWORD: ${MIDDLEWARE_FILE_PASSWORD:?MIDDLEWARE_FILE_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_NOTIFY_PASSWORD: ${MIDDLEWARE_NOTIFY_PASSWORD:?MIDDLEWARE_NOTIFY_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_JOB_PASSWORD: ${MIDDLEWARE_JOB_PASSWORD:?MIDDLEWARE_JOB_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_MONITOR_PASSWORD: ${MIDDLEWARE_MONITOR_PASSWORD:?MIDDLEWARE_MONITOR_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_AUTH_PASSWORD: ${MIDDLEWARE_AUTH_PASSWORD:?MIDDLEWARE_AUTH_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_AI_PASSWORD: ${MIDDLEWARE_AI_PASSWORD:?MIDDLEWARE_AI_PASSWORD 必须在 .env 中设置}
      REDIS_EXPORTER_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD 必须在 .env 中设置}
    volumes:
      - redis_data:/data
      - ./certs/runtime:/certs:ro
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user iboot_exporter --pass \"$$REDIS_EXPORTER_PASSWORD\" --tls --cacert /certs/rootCA.pem -p 6379 ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  silo:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: iboot-silo
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # Silo 保留 MinIO 的 MINIO_* 服务端变量契约；凭据必须由 .env 注入。
      MINIO_ROOT_USER: ${SILO_ROOT_USER:?SILO_ROOT_USER 必须在 .env 中设置}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?SILO_ROOT_PASSWORD 必须在 .env 中设置}
      # mcli / Go 客户端通过该变量信任本地 CA
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - silo_data:/data
      - ./certs/runtime:/certs:ro
    command: server /data --console-address ":9001" --certs-dir /certs
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mcli alias set hc https://127.0.0.1:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null && mcli ls hc >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  silo-init:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: silo-init
    entrypoint: ["/bin/sh", "/scripts/silo-init.sh"]
    environment:
      SILO_ROOT_USER: ${SILO_ROOT_USER:?SILO_ROOT_USER 必须在 .env 中设置}
      SILO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?SILO_ROOT_PASSWORD 必须在 .env 中设置}
      SILO_FILE_ACCESS_KEY: ${SILO_FILE_ACCESS_KEY:-iboot_file}
      SILO_FILE_SECRET_KEY: ${SILO_FILE_SECRET_KEY:?SILO_FILE_SECRET_KEY 必须在 .env 中设置}
      SILO_JOB_ACCESS_KEY: ${SILO_JOB_ACCESS_KEY:-iboot_job}
      SILO_JOB_SECRET_KEY: ${SILO_JOB_SECRET_KEY:?SILO_JOB_SECRET_KEY 必须在 .env 中设置}
      SILO_AI_ACCESS_KEY: ${SILO_AI_ACCESS_KEY:-iboot_ai}
      SILO_AI_SECRET_KEY: ${SILO_AI_SECRET_KEY:?SILO_AI_SECRET_KEY 必须在 .env 中设置}
      SILO_FILE_BUCKET: ${IBOOT_FILE_SILO_BUCKET:-iboot-files}
      SILO_AI_BUCKET: ${IBOOT_AI_SILO_BUCKET:-iboot-ai}
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ../scripts/silo-init.sh:/scripts/silo-init.sh:ro
      - ./certs/runtime:/certs:ro
    networks:
      - data
    depends_on:
      silo:
        condition: service_healthy

  elasticsearch:
    image: elasticsearch:9.5.5
    container_name: iboot-elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD 必须在 .env 中设置}
    volumes:
      - ./scripts/elk/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      # ES 9.5 只允许从配置目录读取 PEM 证书
      - ./certs/runtime:/usr/share/elasticsearch/config/certs:ro
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /usr/share/elasticsearch/config/certs/rootCA.pem -u elastic:$${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 一次性把 kibana_system 的密码同步到 ES；Kibana 9.5 禁止使用 elastic 超级用户。
  elasticsearch-init:
    image: elasticsearch:9.5.5
    container_name: iboot-elasticsearch-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf --cacert /certs/rootCA.pem -u "elastic:$${ELASTIC_PASSWORD}" https://elasticsearch:9200/_cluster/health >/dev/null 2>&1; do sleep 2; done
        curl -sf --cacert /certs/rootCA.pem -u "elastic:$${ELASTIC_PASSWORD}"           -X POST -H 'Content-Type: application/json'           -d "{\"password\":\"$${KIBANA_SYSTEM_PASSWORD}\"}"           https://elasticsearch:9200/_security/user/kibana_system/_password >/dev/null
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD 必须在 .env 中设置}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?KIBANA_SYSTEM_PASSWORD 必须在 .env 中设置}
    volumes:
      - ./certs/runtime:/certs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  # 一次性创建 Elasticsearch 最小权限账号；依赖 ES 的服务与日志链路在它完成后启动。
  es-users-init:
    image: elasticsearch:9.5.5
    container_name: iboot-es-users-init
    entrypoint: ["/bin/bash", "/scripts/es-users-init.sh"]
    environment:
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD 必须在 .env 中设置}
      ES_AI_PASSWORD: ${ES_AI_PASSWORD:?ES_AI_PASSWORD 必须在 .env 中设置}
      ES_NOTIFY_PASSWORD: ${ES_NOTIFY_PASSWORD:?ES_NOTIFY_PASSWORD 必须在 .env 中设置}
      ES_MONITOR_PASSWORD: ${ES_MONITOR_PASSWORD:?ES_MONITOR_PASSWORD 必须在 .env 中设置}
      ES_LOGSTASH_PASSWORD: ${ES_LOGSTASH_PASSWORD:?ES_LOGSTASH_PASSWORD 必须在 .env 中设置}
      ES_GRAFANA_PASSWORD: ${ES_GRAFANA_PASSWORD:?ES_GRAFANA_PASSWORD 必须在 .env 中设置}
      ES_EXPORTER_PASSWORD: ${ES_EXPORTER_PASSWORD:?ES_EXPORTER_PASSWORD 必须在 .env 中设置}
    volumes:
      - ../scripts/es-users-init.sh:/scripts/es-users-init.sh:ro
      - ./certs/runtime:/certs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  logstash:
    image: logstash:9.5.5
    container_name: iboot-logstash
    volumes:
      - ./scripts/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./certs/runtime:/certs:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - XPACK_MONITORING_ENABLED=false
      - ES_LOGSTASH_PASSWORD=${ES_LOGSTASH_PASSWORD:?ES_LOGSTASH_PASSWORD 必须在 .env 中设置}
      - KAFKA_LOGSTASH_PASSWORD=${KAFKA_LOGSTASH_PASSWORD:?KAFKA_LOGSTASH_PASSWORD 必须在 .env 中设置}
    restart: unless-stopped
    networks:
      - data
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-users-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats/pipelines?pretty | grep -q 'main' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ==================== 注册中心与链路追踪 ====================
  # Nacos 3.x 控制台与主端口分离，控制台映射到宿主机 8849。
  nacos:
    image: nacos/nacos-server:v3.3.0
    container_name: iboot-nacos
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:8849:8080"
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      # 管理端鉴权必须开启；sentinel-init.sh 先登录再写入。
      - NACOS_AUTH_ADMIN_ENABLE=true
      # 控制台鉴权本地关闭以支持门户内嵌；非本地由 docker-compose.prod.yml 开启。
      - NACOS_AUTH_CONSOLE_ENABLE=false
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN 必须在 .env 中设置}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-iboot}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-iboot}
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      # Nacos 3.3：HTTP/控制台走 Spring Boot server.ssl，gRPC 单独启用 TLS
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_KEY_STORE=file:/certs/nacos-keystore.p12
      - SERVER_SSL_KEY_STORE_PASSWORD=changeit
      - SERVER_SSL_KEY_STORE_TYPE=PKCS12
      # Nacos 的 gRPC TLS 属性需要以 JVM 系统属性注入；纯环境变量名无法映射 camelCase
      - JAVA_TOOL_OPTIONS=-Dnacos.remote.server.rpc.tls.enableTls=true -Dnacos.remote.server.rpc.tls.certChainFile=file:/certs/portal.pem -Dnacos.remote.server.rpc.tls.certPrivateKey=file:/certs/portal-key.pem -Dnacos.remote.server.rpc.tls.mutualAuthEnable=true -Dnacos.remote.server.rpc.tls.trustCollectionCertFile=file:/certs/rootCA.pem
    volumes:
      - ./certs/runtime:/certs:ro
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /certs/rootCA.pem https://localhost:8080/v3/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 初始化 Nacos 管理员密码与服务账号；业务服务依赖它完成后再注册。
  nacos-init:
    image: nacos/nacos-server:v3.3.0
    container_name: iboot-nacos-init
    entrypoint: ["/bin/sh", "/scripts/nacos-init.sh"]
    environment:
      NACOS_ADDR: nacos:8848
      NACOS_SCHEME: https
      NACOS_CACERT: /certs/rootCA.pem
      NACOS_ADMIN_PASSWORD: ${NACOS_ADMIN_PASSWORD:?NACOS_ADMIN_PASSWORD 必须在 .env 中设置}
      NACOS_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME 必须在 .env 中设置}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_SYSTEM_PASSWORD: ${MIDDLEWARE_SYSTEM_PASSWORD:?MIDDLEWARE_SYSTEM_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_WORKFLOW_PASSWORD: ${MIDDLEWARE_WORKFLOW_PASSWORD:?MIDDLEWARE_WORKFLOW_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_FILE_PASSWORD: ${MIDDLEWARE_FILE_PASSWORD:?MIDDLEWARE_FILE_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_NOTIFY_PASSWORD: ${MIDDLEWARE_NOTIFY_PASSWORD:?MIDDLEWARE_NOTIFY_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_JOB_PASSWORD: ${MIDDLEWARE_JOB_PASSWORD:?MIDDLEWARE_JOB_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_MONITOR_PASSWORD: ${MIDDLEWARE_MONITOR_PASSWORD:?MIDDLEWARE_MONITOR_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_AUTH_PASSWORD: ${MIDDLEWARE_AUTH_PASSWORD:?MIDDLEWARE_AUTH_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_AI_PASSWORD: ${MIDDLEWARE_AI_PASSWORD:?MIDDLEWARE_AI_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_GATEWAY_PASSWORD: ${MIDDLEWARE_GATEWAY_PASSWORD:?MIDDLEWARE_GATEWAY_PASSWORD 必须在 .env 中设置}
      MIDDLEWARE_OPS_PASSWORD: ${MIDDLEWARE_OPS_PASSWORD:?MIDDLEWARE_OPS_PASSWORD 必须在 .env 中设置}
    volumes:
      - ../scripts/nacos-init.sh:/scripts/nacos-init.sh:ro
      - ./certs/runtime:/certs:ro
    depends_on:
      nacos:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.10
    container_name: iboot-sentinel-dashboard
    ports:
      - "127.0.0.1:8858:8858"
    environment:
      TZ: Asia/Shanghai
      # 本地开发关闭登录；非本地部署必须用 docker-compose.prod.yml 覆盖并注入账号密码
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -Dauth.enabled=false"
    # 宿主机开发进程场景下，Dashboard 反向探测的兜底地址
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8858/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== Seata（AT 全局事务协调器） ====================
  seata-server:
    image: apache/seata-server:2.6.0
    container_name: iboot-seata-server
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      TZ: Asia/Shanghai
      # 本地开发限制堆与直接内存；镜像默认 2g
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_MaxDirectMemorySize: 256m
    volumes:
      # file store 的会话目录；不覆盖 /seata-server，否则会遮住应用类与配置
      - seata_data:/seata-server/sessionStore
    restart: unless-stopped
    networks:
      - tx
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8091' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== RocketMQ（审批通知事件） ====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.5.0
    container_name: iboot-rocketmq-namesrv
    command: sh mqnamesrv
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    restart: unless-stopped
    networks:
      - mq
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 卷由 root 创建，broker 以 uid 3000 运行；先修正属主再启动。
  rocketmq-store-init:
    image: apache/rocketmq:5.5.0
    container_name: iboot-rocketmq-store-init
    user: "0:0"
    command: sh -c "mkdir -p /home/rocketmq/store && chown -R 3000:3000 /home/rocketmq/store"
    volumes:
      - rocketmq_broker_data:/home/rocketmq/store
    restart: "no"
    networks:
      - mq

  rocketmq-broker:
    image: apache/rocketmq:5.5.0
    container_name: iboot-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=256m"
    volumes:
      - rocketmq_broker_data:/home/rocketmq/store
    restart: unless-stopped
    networks:
      - mq
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rocketmq-proxy:
    image: apache/rocketmq:5.5.0
    container_name: iboot-rocketmq-proxy
    command: sh mqproxy -n rocketmq-namesrv:9876
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    volumes:
      - ./rocketmq/rmq-proxy.json:/home/rocketmq/rocketmq-5.5.0/conf/rmq-proxy.json:ro
      - ./certs/runtime:/certs:ro
    restart: unless-stopped
    networks:
      - mq
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # RocketMQ 应用入口：只转发 TLS ClientHello，明文连接被拒绝。
  rocketmq-tls:
    image: nginx:1.30.6-alpine3.24
    container_name: iboot-rocketmq-tls
    volumes:
      - ./rocketmq/tls-proxy.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:18081:8081"
    restart: unless-stopped
    networks:
      - app
      - mq
    depends_on:
      rocketmq-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rocketmq-init:
    image: apache/rocketmq:5.5.0
    container_name: iboot-rocketmq-init
    command: sh /home/rocketmq/init-topics.sh
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./rocketmq/init-topics.sh:/home/rocketmq/init-topics.sh:ro
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    restart: "no"
    networks:
      - mq

  # ==================== Kafka（日志缓冲层） ====================
  # KRaft 单节点，不部署 ZooKeeper；只作 24 小时日志缓冲，不承载业务事件。
  # 两个客户端监听使用 SASL_SSL：kafka:9092 给容器内服务，localhost:29092 给宿主机进程与工具；9093 为 controller。
  kafka:
    image: apache/kafka:4.4.0
    container_name: iboot-kafka
    environment:
      TZ: Asia/Shanghai
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # 三个监听都使用 SASL_SSL：INTERNAL 容器内、HOST 宿主机、CONTROLLER 节点内；controller 不发布。
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,HOST:SASL_SSL,CONTROLLER:SASL_SSL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # SASL/PLAIN 账号按用途区分；broker 账号同时用于节点间与 controller 通信。
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${KAFKA_BROKER_PASSWORD:?KAFKA_BROKER_PASSWORD 必须在 .env 中设置}"
        user_broker="${KAFKA_BROKER_PASSWORD:?KAFKA_BROKER_PASSWORD 必须在 .env 中设置}"
        user_iboot_log="${KAFKA_LOG_PASSWORD:?KAFKA_LOG_PASSWORD 必须在 .env 中设置}"
        user_iboot_logstash="${KAFKA_LOGSTASH_PASSWORD:?KAFKA_LOGSTASH_PASSWORD 必须在 .env 中设置}"
        user_iboot_tools="${KAFKA_TOOLS_PASSWORD:?KAFKA_TOOLS_PASSWORD 必须在 .env 中设置}";
      KAFKA_LISTENER_NAME_HOST_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${KAFKA_BROKER_PASSWORD:?KAFKA_BROKER_PASSWORD 必须在 .env 中设置}"
        user_broker="${KAFKA_BROKER_PASSWORD:?KAFKA_BROKER_PASSWORD 必须在 .env 中设置}"
        user_iboot_log="${KAFKA_LOG_PASSWORD:?KAFKA_LOG_PASSWORD 必须在 .env 中设置}"
        user_iboot_logstash="${KAFKA_LOGSTASH_PASSWORD:?KAFKA_LOGSTASH_PASSWORD 必须在 .env 中设置}"
        user_iboot_tools="${KAFKA_TOOLS_PASSWORD:?KAFKA_TOOLS_PASSWORD 必须在 .env 中设置}";
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${KAFKA_BROKER_PASSWORD:?KAFKA_BROKER_PASSWORD 必须在 .env 中设置}"
        user_broker="${KAFKA_BROKER_PASSWORD:?KAFKA_BROKER_PASSWORD 必须在 .env 中设置}";
      # 无 ACL 默认拒绝；broker 与初始化工具是超级用户。
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:broker;User:iboot_tools"
      KAFKA_TOOLS_PASSWORD: ${KAFKA_TOOLS_PASSWORD:?KAFKA_TOOLS_PASSWORD 必须在 .env 中设置}
      # 镜像的 configure 脚本要求 /etc/kafka/secrets 下的文件名与密码文件
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-keystore.p12
      KAFKA_SSL_KEY_CREDENTIALS: kafka-key-password
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka-keystore-password
      # 镜像只在 advertised listeners 含字面量 SSL:// 时自动注入 keystore；
      # 监听已改名为 INTERNAL/HOST，因此显式给出路径与口令。
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-keystore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: HTTPS
      # client auth 为 none 时镜像不会自动注入 truststore；controller 出站 SSL 仍需要它
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./certs/runtime:/etc/kafka/secrets:ro
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "printf '%s\n' 'security.protocol=SASL_SSL' 'sasl.mechanism=PLAIN' 'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"iboot_tools\" password=\"'$${KAFKA_TOOLS_PASSWORD}'\";' 'ssl.truststore.location=/etc/kafka/secrets/truststore.p12' 'ssl.truststore.password=changeit' 'ssl.truststore.type=PKCS12' > /tmp/kafka-client.properties && /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/kafka-client.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # 一次性建 topic；重复执行幂等，不重建已有 topic。
  kafka-init:
    image: apache/kafka:4.4.0
    container_name: iboot-kafka-init
    entrypoint: ["/bin/sh", "/opt/kafka/init-topics.sh"]
    environment:
      TZ: Asia/Shanghai
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: iboot_tools
      KAFKA_SASL_PASSWORD: ${KAFKA_TOOLS_PASSWORD:?KAFKA_TOOLS_PASSWORD 必须在 .env 中设置}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
    volumes:
      - ./kafka/init-topics.sh:/opt/kafka/init-topics.sh:ro
      - ./certs/runtime:/etc/kafka/secrets:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  tempo:
    image: grafana/tempo:2.10.9
    container_name: iboot-tempo
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - ./certs/runtime:/certs:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks:
      - data

  # ==================== SkyWalking APM 对比实验（apm profile） ====================
  # 辅助观测栈：与 Tempo 并行观测同一批服务，默认不启动，实验结束可整体删除。
  # OAP 11 只接受 BanyanDB server API 0.11，三个版本不可自行混搭。
  # 三个服务都不加入任何业务服务的 depends_on。
  skywalking-banyandb:
    image: apache/skywalking-banyandb:0.11.2
    container_name: iboot-skywalking-banyandb
    profiles: ["apm"]
    command: standalone --stream-root-path /data/stream --measure-root-path /data/measure
    expose:
      - "17912"
    volumes:
      - skywalking_banyandb_data:/data
    restart: unless-stopped
    networks:
      - obs
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 17912"]
      interval: 5s
      timeout: 60s
      retries: 120

  skywalking-oap:
    image: apache/skywalking-oap-server:11.1.0
    container_name: iboot-skywalking-oap
    profiles: ["apm"]
    depends_on:
      skywalking-banyandb:
        condition: service_healthy
    ports:
      - "127.0.0.1:11800:11800"
      - "127.0.0.1:12800:12800"
    environment:
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: skywalking-banyandb:17912
      SW_HEALTH_CHECKER: default
      # 官方默认 2GB；本地实验压低上限，避免把 R4 的内存红线顶穿。
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    restart: unless-stopped
    networks:
      - obs
    healthcheck:
      # OAP 镜像没有 curl/wget，用 bash 内建 /dev/tcp 探查询端口。
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/12800"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  skywalking-ui:
    image: apache/skywalking-ui:horizon-1.1.0
    container_name: iboot-skywalking-ui
    profiles: ["apm"]
    depends_on:
      skywalking-oap:
        condition: service_healthy
    ports:
      # 8080 已被 iboot-system 占用，UI 映射到 18082。
      - "127.0.0.1:18082:8081"
    volumes:
      # Horizon 的后端地址与登录用户只从该文件读取，没有环境变量入口。
      - ./skywalking/horizon.yaml:/app/horizon.yaml:ro
    restart: unless-stopped
    networks:
      - obs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==================== 监控组件（observability profile） ====================
  # 证书探针：用本地 CA 完成 TLS 握手，暴露 probe_ssl_earliest_cert_expiry。
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: iboot-blackbox-exporter
    profiles: ["observability"]
    volumes:
      - ./scripts/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./certs/runtime:/certs:ro
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    # 宿主机模式探针需要解析宿主网关；Docker Engine 不会自动提供该域名。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - app
      - obs

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: iboot-prometheus
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # 目录整体只读挂载，按运行模式选择 prometheus.yml 或 prometheus.docker.yml
      - ./scripts/prometheus:/etc/prometheus:ro
      # 服务端口只接受内部 TLS，抓取时用本地 CA 校验
      - ./certs/runtime:/certs:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      # 直接 compose 启动等同于 Docker 全量部署，默认按服务名抓取；宿主机开发由 dev-init.sh 覆盖。
      - '--config.file=/etc/prometheus/${IBOOT_PROMETHEUS_CONFIG:-prometheus.docker.yml}'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=24h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--web.enable-admin-api'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - app
      - obs

  grafana:
    image: grafana/grafana:13.2.6
    container_name: iboot-grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./scripts/grafana/provisioning:/etc/grafana/provisioning
      - ./scripts/grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
      - ./certs/runtime:/certs:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 必须在 .env 中设置}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://localhost:3000
      - ES_GRAFANA_PASSWORD=${ES_GRAFANA_PASSWORD:?ES_GRAFANA_PASSWORD 必须在 .env 中设置}
    restart: unless-stopped
    networks:
      - data
      - obs
    depends_on:
      prometheus:
        condition: service_started
      thanos-query:
        condition: service_started
      es-users-init:
        condition: service_completed_successfully

  alertmanager:
    image: prom/alertmanager:v0.35.0
    container_name: iboot-alertmanager
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./scripts/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./scripts/alertmanager/web.yml:/etc/alertmanager/web.yml:ro
      - ./certs/runtime:/certs:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--web.config.file=/etc/alertmanager/web.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - obs
    depends_on:
      - prometheus

  thanos-sidecar:
    image: thanosio/thanos:v0.42.5
    container_name: thanos-sidecar
    profiles: ["observability"]
    environment:
      AWS_ACCESS_KEY_ID: ${SILO_ROOT_USER:?SILO_ROOT_USER 必须在 .env 中设置}
      AWS_SECRET_ACCESS_KEY: ${SILO_ROOT_PASSWORD:?SILO_ROOT_PASSWORD 必须在 .env 中设置}
      SSL_CERT_FILE: /certs/rootCA.pem
      AWS_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - ./scripts/thanos/bucket.yml:/etc/thanos/bucket.yml
      - ./scripts/thanos/prometheus-http-client.yml:/etc/thanos/prometheus-http-client.yml:ro
      - ./certs/runtime:/certs:ro
      - prometheus_data:/prometheus
    user: "root"
    command:
      - sidecar
      - '--tsdb.path=/prometheus'
      - '--prometheus.url=https://prometheus:9090'
      - '--prometheus.http-client-file=/etc/thanos/prometheus-http-client.yml'
      - '--objstore.config-file=/etc/thanos/bucket.yml'
      - '--grpc-address=0.0.0.0:19191'
      - '--http-address=0.0.0.0:19192'
    restart: unless-stopped
    networks:
      - data
      - obs
    depends_on:
      prometheus:
        condition: service_started
      silo:
        condition: service_healthy

  thanos-store:
    image: thanosio/thanos:v0.42.5
    container_name: thanos-store
    profiles: ["observability"]
    environment:
      AWS_ACCESS_KEY_ID: ${SILO_ROOT_USER:?SILO_ROOT_USER 必须在 .env 中设置}
      AWS_SECRET_ACCESS_KEY: ${SILO_ROOT_PASSWORD:?SILO_ROOT_PASSWORD 必须在 .env 中设置}
      SSL_CERT_FILE: /certs/rootCA.pem
      AWS_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - ./scripts/thanos/bucket.yml:/etc/thanos/bucket.yml
      - ./certs/runtime:/certs:ro
      - thanos_store_data:/var/thanos/store
    user: "root"
    command:
      - store
      - '--objstore.config-file=/etc/thanos/bucket.yml'
      - '--data-dir=/var/thanos/store'
      - '--grpc-address=0.0.0.0:19191'
      - '--http-address=0.0.0.0:19192'
      - '--index-cache-size=500MB'
      - '--chunk-pool-size=2GB'
    restart: unless-stopped
    networks:
      - data
      - obs
    depends_on:
      silo:
        condition: service_healthy

  thanos-query:
    image: thanosio/thanos:v0.42.5
    container_name: thanos-query
    profiles: ["observability"]
    ports:
      - "127.0.0.1:19192:19192"
    volumes:
      - ./scripts/thanos/http.yml:/etc/thanos/http.yml:ro
      - ./certs/runtime:/certs:ro
    command:
      - query
      - '--grpc-address=0.0.0.0:19191'
      - '--http-address=0.0.0.0:19192'
      - '--http.config=/etc/thanos/http.yml'
      - '--endpoint=thanos-sidecar:19191'
      - '--endpoint=thanos-store:19191'
      - '--query.replica-label=replica'
      - '--query.timeout=5m'
    restart: unless-stopped
    networks:
      - data
      - obs
    depends_on:
      - thanos-sidecar
      - thanos-store

  thanos-compact:
    image: thanosio/thanos:v0.42.5
    container_name: thanos-compact
    profiles: ["observability"]
    environment:
      AWS_ACCESS_KEY_ID: ${SILO_ROOT_USER:?SILO_ROOT_USER 必须在 .env 中设置}
      AWS_SECRET_ACCESS_KEY: ${SILO_ROOT_PASSWORD:?SILO_ROOT_PASSWORD 必须在 .env 中设置}
      SSL_CERT_FILE: /certs/rootCA.pem
      AWS_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - ./scripts/thanos/bucket.yml:/etc/thanos/bucket.yml
      - ./certs/runtime:/certs:ro
      - thanos_compact_data:/var/thanos/compact
    user: "root"
    command:
      - compact
      - '--objstore.config-file=/etc/thanos/bucket.yml'
      - '--data-dir=/var/thanos/compact'
      - '--http-address=0.0.0.0:19192'
      - '--wait'
      - '--retention.resolution-raw=30d'
      - '--retention.resolution-5m=90d'
      - '--retention.resolution-1h=1y'
    restart: unless-stopped
    networks:
      - data
      - obs
    depends_on:
      silo:
        condition: service_healthy

  mysql-exporter:
    image: prom/mysqld-exporter:v0.21.0
    container_name: iboot-mysql-exporter
    profiles: ["observability"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD 必须在 .env 中设置}
    command:
      - '--mysqld.address=mysql:3306'
      - '--mysqld.username=${MYSQL_EXPORTER_USER:-iboot_exporter}'
    restart: unless-stopped
    networks:
      - data
      - obs
    depends_on:
      - mysql

  redis-exporter:
    image: oliver006/redis_exporter:v1.97.0
    container_name: iboot-redis-exporter
    profiles: ["observability"]
    environment:
      REDIS_ADDR: rediss://redis:6379
      REDIS_USER: iboot_exporter
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD 必须在 .env 中设置}
      REDIS_EXPORTER_TLS_CA_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ./certs/runtime:/certs:ro
    restart: unless-stopped
    networks:
      - data
      - obs
    depends_on:
      - redis

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: iboot-node-exporter
    profiles: ["observability"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - obs

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.11.0
    container_name: iboot-elasticsearch-exporter
    profiles: ["observability"]
    command:
      - '--es.uri=https://iboot_exporter:${ES_EXPORTER_PASSWORD:?ES_EXPORTER_PASSWORD 必须在 .env 中设置}@elasticsearch:9200'
      - '--es.ca=/certs/rootCA.pem'
      - '--es.all'
      - '--es.indices'
    volumes:
      - ./certs/runtime:/certs:ro
    restart: unless-stopped
    networks:
      - data
      - obs
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-users-init:
        condition: service_completed_successfully

  kibana:
    image: kibana:9.5.5
    container_name: iboot-kibana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?KIBANA_SYSTEM_PASSWORD 必须在 .env 中设置}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/certs/rootCA.pem
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/certs/portal.pem
      - SERVER_SSL_KEY=/certs/portal-key.pem
    volumes:
      - ./certs/runtime:/certs:ro
    restart: unless-stopped
    networks:
      - data
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
      es-users-init:
        condition: service_completed_successfully

  # ==================== 知识图谱（graph profile） ====================
  neo4j:
    image: neo4j:5.26.33-community
    container_name: iboot-neo4j
    profiles: ["graph"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 必须在 .env 中设置}
      # 受本机内存约束（R4）：堆与页缓存显式限制
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
      # Bolt 传输层 TLS；客户端使用 bolt+s://（Neo4j 5.x 的配置前缀是 dbms.ssl）
      - NEO4J_dbms_ssl_policy_bolt_enabled=true
      - NEO4J_dbms_ssl_policy_bolt_base__directory=/certs
      - NEO4J_dbms_ssl_policy_bolt_private__key=private.key
      - NEO4J_dbms_ssl_policy_bolt_public__certificate=public.crt
      - NEO4J_dbms_ssl_policy_bolt_client__auth=NONE
      # 强制 Bolt 只接受 TLS；明文连接必须被拒绝
      - NEO4J_server_bolt_tls__level=REQUIRED
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./certs/runtime:/certs:ro
    restart: unless-stopped
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
  obs:
    driver: bridge
  mq:
    driver: bridge
  tx:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  silo_data:
    name: ${IBOOT_SILO_DATA_VOLUME:-docker_minio_data}
  prometheus_data:
  grafana_data:
  alertmanager_data:
  es_data:
  rocketmq_broker_data:
  kafka_data:
  neo4j_data:
  neo4j_logs:
  thanos_store_data:
  thanos_compact_data:
  admin_logs:
  uploads_data:
  auth_keys:
  tempo_data:
  seata_data:
  skywalking_banyandb_data:
