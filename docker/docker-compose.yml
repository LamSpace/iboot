# iBoot 全栈 Docker Compose 编排
#
# 构建前置：
#   scripts/docker-deploy.sh 会先构建共享 builder 镜像 iboot-backend-builder:local，
#   再执行 docker compose build。单独执行 docker compose build 前必须先完成这一步。
#
# 常用命令：
#   docker compose -f docker/docker-compose.yml up -d --wait
#   docker compose -f docker/docker-compose.yml --profile observability --profile graph up -d --wait

x-app-env: &app-env
  TZ: Asia/Shanghai
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: root
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  NACOS_ADDR: nacos:8848
  SEATA_SERVER_ADDR: seata-server:8091
  IBOOT_SEATA_ENABLED: "true"
  IBOOT_SYSTEM_BASE_URL: http://iboot-system
  # 本地开发默认值；生产通过 .env 或 KMS 注入
  IBOOT_SYSTEM_INTERNAL_TOKEN: ${IBOOT_SYSTEM_INTERNAL_TOKEN:-iboot-dev-internal-token}
  SENTINEL_DASHBOARD: sentinel-dashboard:8858
  TEMPO_OTLP: http://tempo:4318/v1/traces
  IBOOT_LOGGING_KAFKA_ENABLED: "true"
  IBOOT_LOGGING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_JWK_SET_URI: http://iboot-auth:8083/oauth2/jwks
  IBOOT_NOTIFY_BASE_URL: http://iboot-notify:8084
  IBOOT_ROCKETMQ_ENDPOINTS: rocketmq-proxy:8081
  IBOOT_AI_MINIO_ENDPOINT: http://minio:9000
  IBOOT_AI_GRAPH_URI: bolt://neo4j:7687
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

x-app-common: &app-common
  env_file:
    - ../.env
  restart: unless-stopped
  networks:
    - iboot-network

x-app-healthcheck: &app-healthcheck
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 90s

x-backend-build: &backend-build
  context: ..
  dockerfile: docker/Dockerfile.backend

services:
  # ==================== 构建阶段 ====================
  # 只作为构建目标，不会常驻；由 scripts/docker-deploy.sh 先构建。
  iboot-backend-builder:
    image: iboot-backend-builder:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend-builder
    profiles: ["build"]

  # ==================== 数据库初始化 ====================
  db-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dbinit
    container_name: iboot-db-init
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      IBOOT_DB_NAME: iboot
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - iboot-network

  # ==================== 应用服务 ====================
  iboot-system:
    <<: *app-common
    container_name: iboot-system
    build:
      <<: *backend-build
      args:
        MODULE: iboot-system
        PORT: "8080"
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms512m -Xmx1024m --enable-native-access=ALL-UNNAMED"
    volumes:
      - admin_logs:/app/logs
      - uploads_data:/app/uploads
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-ai:
    <<: *app-common
    container_name: iboot-ai
    build:
      <<: *backend-build
      args:
        MODULE: iboot-ai
        PORT: "8081"
    ports:
      - "8081:8081"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms512m -Xmx1024m --enable-native-access=ALL-UNNAMED"
      # 开启智能体与智能体管理页面所需的控制器
      IBOOT_AI_AGENT_ENABLED: "true"
    volumes:
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      start_period: 150s
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-file:
    <<: *app-common
    container_name: iboot-file
    build:
      <<: *backend-build
      args:
        MODULE: iboot-file
        PORT: "8082"
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
    volumes:
      - admin_logs:/app/logs
      - uploads_data:/app/uploads
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      minio:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-auth:
    <<: *app-common
    container_name: iboot-auth
    build:
      <<: *backend-build
      args:
        MODULE: iboot-auth
        PORT: "8083"
    ports:
      - "8083:8083"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      IBOOT_AUTH_ISSUER: http://localhost:8088
      IBOOT_AUTH_REDIRECT_URI: http://localhost/callback
      IBOOT_AUTH_LOGOUT_REDIRECT_URI: http://localhost/login
      # 持久化签名密钥：认证服务重启后仍能验证此前签发的令牌
      IBOOT_AUTH_JWK_FILE: /app/keys/iboot-auth-jwk.json
    volumes:
      - admin_logs:/app/logs
      - auth_keys:/app/keys
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-notify:
    <<: *app-common
    container_name: iboot-notify
    build:
      <<: *backend-build
      args:
        MODULE: iboot-notify
        PORT: "8084"
    ports:
      - "8084:8084"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
    volumes:
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-job:
    <<: *app-common
    container_name: iboot-job
    build:
      <<: *backend-build
      args:
        MODULE: iboot-job
        PORT: "8085"
    ports:
      - "8085:8085"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      # 容器内没有 docker CLI；启用备份会触发启动自检失败
      IBOOT_BACKUP_ENABLED: "false"
    volumes:
      - admin_logs:/app/logs
      - uploads_data:/app/uploads
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-workflow:
    <<: *app-common
    container_name: iboot-workflow
    build:
      <<: *backend-build
      args:
        MODULE: iboot-workflow
        PORT: "8086"
    ports:
      - "8086:8086"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
    volumes:
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8086"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-monitor:
    <<: *app-common
    container_name: iboot-monitor
    build:
      <<: *backend-build
      args:
        MODULE: iboot-monitor
        PORT: "8087"
    ports:
      - "8087:8087"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
    volumes:
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087"]
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-gateway:
    <<: *app-common
    container_name: iboot-gateway
    build:
      <<: *backend-build
      args:
        MODULE: iboot-gateway
        PORT: "8088"
    ports:
      - "8088:8088"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      SPRING_PROFILES_ACTIVE: nacos
    volumes:
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088"]
      start_period: 90s
    depends_on:
      nacos:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-ops:
    <<: *app-common
    container_name: iboot-ops
    build:
      <<: *backend-build
      args:
        MODULE: iboot-ops
        PORT: "8089"
    ports:
      - "8089:8089"
    environment:
      <<: *app-env
      JAVA_OPTIONS: "-Xms256m -Xmx512m --enable-native-access=ALL-UNNAMED"
      # 本地全栈默认关闭控制台认证；生产部署必须开启并注入密码
      IBOOT_OPS_SECURITY_ENABLED: "false"
      IBOOT_OPS_USER: ops
    volumes:
      - admin_logs:/app/logs
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8089"]
    depends_on:
      nacos:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  iboot-portal:
    build:
      context: ../iboot-portal
      dockerfile: Dockerfile
    container_name: iboot-portal
    ports:
      - "80:80"
    depends_on:
      iboot-gateway:
        condition: service_healthy
      # nginx 启动时解析 /sba、/druid、/swagger 上游
      iboot-ops:
        condition: service_healthy
      iboot-system:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      # 用 IPv4 回环：nginx 只监听 IPv4，localhost 可能解析到 ::1
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== 基础设施 ====================
  mysql:
    image: mysql:8.0.45
    container_name: iboot-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: iboot
      # 允许其它容器以 root 连接；仅用于本地/单机部署
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      # 强制走 TCP：初始化临时实例只监听 socket，避免健康检查过早通过
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7.0.14
    container_name: iboot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: iboot-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-init
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/thanos;
      exit 0;
      "
    networks:
      - iboot-network
    depends_on:
      minio:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    container_name: iboot-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
    volumes:
      - ./scripts/elk/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  logstash:
    image: docker.elastic.co/logstash/logstash:9.2.3
    container_name: iboot-logstash
    ports:
      - "5044:5044"
    volumes:
      - ./scripts/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - XPACK_MONITORING_ENABLED=false
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats/pipelines?pretty | grep -q 'main' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ==================== 注册中心与链路追踪 ====================
  # Nacos 3.x 控制台与主端口分离，控制台映射到宿主机 8849。
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: iboot-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "8849:8080"
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
      - NACOS_AUTH_TOKEN=aWJvb3QtZGV2LW5hY29zLWF1dGgtdG9rZW4tMzJieXRl
      - NACOS_AUTH_IDENTITY_KEY=iboot-dev
      - NACOS_AUTH_IDENTITY_VALUE=iboot-dev
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v3/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.9
    container_name: iboot-sentinel-dashboard
    ports:
      - "8858:8858"
    environment:
      TZ: Asia/Shanghai
      # 本地开发关闭登录；非本地部署必须用 docker-compose.prod.yml 覆盖并注入账号密码
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -Dauth.enabled=false"
    # 宿主机开发进程场景下，Dashboard 反向探测的兜底地址
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8858/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== Seata（AT 全局事务协调器） ====================
  seata-server:
    image: apache/seata-server:2.5.0
    container_name: iboot-seata-server
    ports:
      - "8091:8091"
    environment:
      TZ: Asia/Shanghai
      # 本地开发限制堆与直接内存；镜像默认 2g
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_MaxDirectMemorySize: 256m
    volumes:
      # file store 的会话目录；不覆盖 /seata-server，否则会遮住应用类与配置
      - seata_data:/seata-server/sessionStore
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8091' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== RocketMQ（审批通知事件） ====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: iboot-rocketmq-namesrv
    command: sh mqnamesrv
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 卷由 root 创建，broker 以 uid 3000 运行；先修正属主再启动。
  rocketmq-store-init:
    image: apache/rocketmq:5.3.1
    container_name: iboot-rocketmq-store-init
    user: "0:0"
    command: sh -c "mkdir -p /home/rocketmq/store && chown -R 3000:3000 /home/rocketmq/store"
    volumes:
      - rocketmq_broker_data:/home/rocketmq/store
    restart: "no"
    networks:
      - iboot-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: iboot-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=256m"
    volumes:
      - rocketmq_broker_data:/home/rocketmq/store
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rocketmq-proxy:
    image: apache/rocketmq:5.3.1
    container_name: iboot-rocketmq-proxy
    command: sh mqproxy -n rocketmq-namesrv:9876
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    volumes:
      - ./rocketmq/rmq-proxy.json:/home/rocketmq/rocketmq-5.3.1/conf/rmq-proxy.json:ro
    ports:
      - "18080:8080"
      - "18081:8081"
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rocketmq-init:
    image: apache/rocketmq:5.3.1
    container_name: iboot-rocketmq-init
    command: sh /home/rocketmq/init-topics.sh
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./rocketmq/init-topics.sh:/home/rocketmq/init-topics.sh:ro
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    restart: "no"
    networks:
      - iboot-network

  # ==================== Kafka（日志缓冲层） ====================
  # KRaft 单节点，不部署 ZooKeeper；只作 24 小时日志缓冲，不承载业务事件。
  # 双监听：kafka:9092 给容器内服务，localhost:29092 给宿主机进程与 kafka-*.sh 工具。
  kafka:
    image: apache/kafka:4.1.1
    container_name: iboot-kafka
    environment:
      TZ: Asia/Shanghai
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # 一次性建 topic；重复执行幂等，不重建已有 topic。
  kafka-init:
    image: apache/kafka:4.1.1
    container_name: iboot-kafka-init
    entrypoint: ["/bin/sh", "/opt/kafka/init-topics.sh"]
    environment:
      TZ: Asia/Shanghai
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./kafka/init-topics.sh:/opt/kafka/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks:
      - iboot-network

  tempo:
    image: grafana/tempo:2.10.8
    container_name: iboot-tempo
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3200:3200"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks:
      - iboot-network

  # ==================== 监控组件（observability profile） ====================
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: iboot-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./scripts/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=24h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--web.enable-admin-api'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - iboot-network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: iboot-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - ./scripts/grafana/provisioning:/etc/grafana/provisioning
      - ./scripts/grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      - prometheus
      - thanos-query

  alertmanager:
    image: prom/alertmanager:v0.29.0
    container_name: iboot-alertmanager
    profiles: ["observability"]
    ports:
      - "9093:9093"
    volumes:
      - ./scripts/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      - prometheus

  thanos-sidecar:
    image: thanosio/thanos:v0.36.1
    container_name: thanos-sidecar
    profiles: ["observability"]
    ports:
      - "19191:19191"
    volumes:
      - ./scripts/thanos/bucket.yml:/etc/thanos/bucket.yml
      - prometheus_data:/prometheus
    user: "root"
    command:
      - sidecar
      - '--tsdb.path=/prometheus'
      - '--prometheus.url=http://prometheus:9090'
      - '--objstore.config-file=/etc/thanos/bucket.yml'
      - '--grpc-address=0.0.0.0:19191'
      - '--http-address=0.0.0.0:19192'
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      prometheus:
        condition: service_started
      minio:
        condition: service_healthy

  thanos-store:
    image: thanosio/thanos:v0.36.1
    container_name: thanos-store
    profiles: ["observability"]
    ports:
      - "19193:19192"
    volumes:
      - ./scripts/thanos/bucket.yml:/etc/thanos/bucket.yml
      - thanos_store_data:/var/thanos/store
    user: "root"
    command:
      - store
      - '--objstore.config-file=/etc/thanos/bucket.yml'
      - '--data-dir=/var/thanos/store'
      - '--grpc-address=0.0.0.0:19191'
      - '--http-address=0.0.0.0:19192'
      - '--index-cache-size=500MB'
      - '--chunk-pool-size=2GB'
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      minio:
        condition: service_healthy

  thanos-query:
    image: thanosio/thanos:v0.36.1
    container_name: thanos-query
    profiles: ["observability"]
    ports:
      - "19192:19192"
    command:
      - query
      - '--grpc-address=0.0.0.0:19191'
      - '--http-address=0.0.0.0:19192'
      - '--store=thanos-sidecar:19191'
      - '--store=thanos-store:19191'
      - '--query.replica-label=replica'
      - '--query.timeout=5m'
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      - thanos-sidecar
      - thanos-store

  thanos-compact:
    image: thanosio/thanos:v0.36.1
    container_name: thanos-compact
    profiles: ["observability"]
    ports:
      - "19194:19192"
    volumes:
      - ./scripts/thanos/bucket.yml:/etc/thanos/bucket.yml
      - thanos_compact_data:/var/thanos/compact
    user: "root"
    command:
      - compact
      - '--objstore.config-file=/etc/thanos/bucket.yml'
      - '--data-dir=/var/thanos/compact'
      - '--http-address=0.0.0.0:19192'
      - '--wait'
      - '--retention.resolution-raw=30d'
      - '--retention.resolution-5m=90d'
      - '--retention.resolution-1h=1y'
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      minio:
        condition: service_healthy

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.0
    container_name: iboot-mysql-exporter
    profiles: ["observability"]
    ports:
      - "9104:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: root
    command:
      - '--mysqld.address=mysql:3306'
      - '--mysqld.username=root'
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      - mysql

  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    container_name: iboot-redis-exporter
    profiles: ["observability"]
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      - redis

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: iboot-node-exporter
    profiles: ["observability"]
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - iboot-network

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.5.0
    container_name: iboot-elasticsearch-exporter
    profiles: ["observability"]
    ports:
      - "9114:9114"
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.all'
      - '--es.indices'
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.3
    container_name: iboot-kibana
    profiles: ["observability"]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    restart: unless-stopped
    networks:
      - iboot-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ==================== 知识图谱（graph profile） ====================
  neo4j:
    image: neo4j:5.26.29-community
    container_name: iboot-neo4j
    profiles: ["graph"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-iboot123456}
      # 受本机内存约束（R4）：堆与页缓存显式限制
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    networks:
      - iboot-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  iboot-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  es_data:
  rocketmq_broker_data:
  kafka_data:
  neo4j_data:
  neo4j_logs:
  thanos_store_data:
  thanos_compact_data:
  admin_logs:
  uploads_data:
  auth_keys:
  tempo_data:
  seata_data:
