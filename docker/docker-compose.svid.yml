# Compose 全量模式的 SPIRE SVID 覆盖层。
#
# 用法（与基础 compose 叠加，启用 spire + svid profile）：
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.svid.yml \
#     --profile spire --profile svid up -d
#
# 每个服务有一个一次性 sidecar：通过 Agent Workload API 取回 SVID 写入命名卷，
# 应用容器只读挂载并改用 SVID 证书；信任 bundle 由 scripts/spire-svid-sync.sh --setup 合并。
# 默认 compose 不引用本文件，mkcert 路径保持不变。

services:
  iboot-system:
    environment:
      IBOOT_TLS_CERT_FILE: /svid/svid.0.pem
      IBOOT_TLS_KEY_FILE: /svid/svid.0.key
    volumes:
      - svid_iboot_system:/svid:ro
    depends_on:
      svid-iboot-system:
        condition: service_completed_successfully

  svid-iboot-system:
    image: iboot-svid-sidecar:local
    build:
      context: ./svid-sidecar
    profiles: ["svid"]
    labels:
      com.iboot.svid.service: iboot-system
    command: ["/opt/spire/bin/spire-agent api fetch x509 -socketPath /run/spire/sockets/agent.sock -write /svid && chmod 644 /svid/*"]
    volumes:
      - spire_agent_socket:/run/spire/sockets
      - svid_iboot_system:/svid
    depends_on:
      spire-agent:
        condition: service_healthy
    restart: "no"

