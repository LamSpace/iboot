apiVersion: 1

datasources:
  - name: Thanos
    type: prometheus
    access: proxy
    url: https://thanos-query:19192
    isDefault: true
    secureJsonData:
      tlsCACert: $__file{/certs/rootCA.pem}
    jsonData:
      tlsAuthWithCACert: true
      timeInterval: "30s"
    editable: true

  - name: Prometheus
    # 显式声明 uid：看板按该 uid 引用数据源，避免重新供给后 uid 漂移导致面板失效。
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: https://prometheus:9090
    isDefault: false
    secureJsonData:
      tlsCACert: $__file{/certs/rootCA.pem}
    jsonData:
      tlsAuthWithCACert: true
      timeInterval: "10s"
    editable: true
