apiVersion: 1

# 集中日志数据源：与门户“运行日志”页面共用同一份 Elasticsearch 索引。
# ES 只接受 HTTPS + 认证；CA 为公开证书，密码从编排环境注入。
datasources:
  - name: Elasticsearch
    uid: iboot-elasticsearch
    type: elasticsearch
    access: proxy
    url: https://elasticsearch:9200
    isDefault: false
    basicAuth: true
    basicAuthUser: elastic
    secureJsonData:
      basicAuthPassword: ${ELASTIC_PASSWORD}
      tlsCACert: $__file{/certs/rootCA.pem}
    jsonData:
      tlsAuthWithCACert: true
      index: iboot-logs-*
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: level
    editable: true
