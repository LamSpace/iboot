apiVersion: 1

providers:
  # Provider 1: 社区面板（MySQL / Redis / Elasticsearch / Node / JVM / Spring Boot）
  - name: 'Vendor Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/vendor
      foldersFromFilesStructure: false

  # Provider 2: iBoot 自定义业务监控仪表板
  - name: 'iBoot Custom Metrics'
    orgId: 1
    folder: 'iBoot Custom'
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/custom
      foldersFromFilesStructure: false
