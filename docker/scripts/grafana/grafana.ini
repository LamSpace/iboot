[auth.anonymous]
enabled = true
# 匿名访问只读：门户内嵌看板可用，但不能改数据源或调用管理接口。
org_role = Viewer

[auth.basic]
enabled = false

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[security]
admin_user = admin
# 管理员口令由 GF_SECURITY_ADMIN_PASSWORD（GRAFANA_ADMIN_PASSWORD）注入，不在仓库保留默认值。
allow_embedding = true
cookie_samesite = none

[server]
root_url = %(protocol)s://%(domain)s:%(http_port)s/