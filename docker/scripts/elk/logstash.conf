# iBoot Logstash 管道配置
# 接收来自 logstash-logback-encoder 的 JSON 日志，转发至 Elasticsearch。
# Kafka 与 Elasticsearch 两端都使用 TLS；凭据由编排环境注入。

input {
  # Kafka 缓冲层：服务经 logback 投递到 iboot-logs，再由 Logstash 消费写入 ES。
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["iboot-logs"]
    group_id => "iboot-logstash"
    codec => json
    auto_offset_reset => "latest"
    consumer_threads => 2
    security_protocol => "SSL"
    ssl_truststore_location => "/certs/truststore.p12"
    ssl_truststore_password => "changeit"
    ssl_truststore_type => "PKCS12"
    ssl_endpoint_identification_algorithm => "https"
  }
}

filter {
  # 确保时间戳字段存在
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # 移除不需要的字段
  mutate {
    remove_field => ["@version", "host", "port"]
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    index => "iboot-logs-%{+YYYY.MM.dd}"
    ssl_enabled => true
    ssl_certificate_authorities => "/certs/rootCA.pem"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
}
