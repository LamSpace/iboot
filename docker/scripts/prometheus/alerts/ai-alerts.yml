groups:
  - name: ai-alerts
    interval: 30s
    rules:
      # ==================== 服务可用性 ====================
      - alert: AiServiceDown
        expr: up{job="iboot-ai"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI 服务不可用"
          description: "iboot-ai 已连续 1 分钟无法被 Prometheus 抓取"

      # ==================== 成本 ====================
      - alert: AiDailyTokenBudgetHigh
        expr: sum(increase(iboot_ai_tokens_total[24h])) > 5000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI 日 token 用量超过告警阈值"
          description: "过去 24 小时 token 用量为 {{ $value }}，告警阈值为 5,000,000"

      - alert: AiQuotaRejectionSpike
        expr: sum(increase(iboot_ai_quota_rejected_total[10m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AI 配额拒绝次数异常"
          description: "过去 10 分钟配额拒绝 {{ $value }} 次，可能存在异常调用"

      # ==================== 质量 ====================
      - alert: AiChatErrorRateHigh
        expr: |
          sum(rate(iboot_ai_chat_requests_total{outcome="error"}[5m]))
          /
          sum(rate(iboot_ai_chat_requests_total[5m]))
          * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI 对话错误率过高"
          description: "5 分钟错误率超过 5%，当前值为 {{ $value | printf \"%.1f\" }}%"

      - alert: AiFirstTokenSlow
        expr: histogram_quantile(0.95, sum(rate(iboot_ai_first_token_seconds_bucket[5m])) by (le)) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI 首 token 延迟过高"
          description: "首 token p95 超过 3 秒，当前值为 {{ $value | printf \"%.2f\" }} 秒"

      # ==================== 知识库 / RAG ====================
      - alert: AiRagErrorRateHigh
        expr: |
          sum(rate(iboot_ai_rag_requests_total{outcome="error"}[5m]))
          /
          sum(rate(iboot_ai_rag_requests_total[5m]))
          * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "知识库问答错误率过高"
          description: "5 分钟错误率超过 10%，当前值为 {{ $value | printf \"%.1f\" }}%"

      - alert: AiRagEmptyResultsHigh
        expr: sum(increase(iboot_ai_rag_empty_results_total[10m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "知识库空结果偏多"
          description: "过去 10 分钟空结果 {{ $value }} 次，检查文档覆盖与召回质量"

      - alert: AiOcrDailyPagesHigh
        expr: sum(increase(iboot_ai_rag_ocr_pages_total[24h])) > 180
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OCR 日页数接近配额"
          description: "过去 24 小时 OCR {{ $value }} 页，默认日上限 200 页"

      - alert: AiOcrQuotaRejected
        expr: sum(increase(iboot_ai_rag_ocr_quota_rejected_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OCR 配额拒绝"
          description: "过去 10 分钟出现 OCR 配额拒绝，检查用量与预算"

      # ==================== 智能体编排 ====================
      - alert: AiAgentBypassBlocked
        expr: sum(increase(iboot_ai_agent_approval_bypass_blocked_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "检测到未确认的写操作尝试"
          description: "过去 5 分钟出现 {{ $value }} 次未授权执行尝试，请立即检查运行轨迹"

      - alert: AiAgentToolErrorRateHigh
        expr: |
          sum(rate(iboot_ai_agent_tool_calls_total{outcome=~"failed|error|denied"}[5m]))
          /
          sum(rate(iboot_ai_agent_tool_calls_total[5m]))
          * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "智能体工具失败率过高"
          description: "5 分钟工具失败率超过 10%，当前值为 {{ $value | printf \"%.1f\" }}%"
