    static_configs:
      - targets: ['host.docker.internal:8083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'iboot-auth:8083'

  - job_name: 'iboot-notify'
    metrics_path: '/actuator/prometheus'
    scheme: https
    tls_config:
      ca_file: /certs/rootCA.pem
    static_configs:
      - targets: ['host.docker.internal:8084']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'iboot-notify:8084'

  - job_name: 'iboot-job'
    metrics_path: '/actuator/prometheus'
    scheme: https
    tls_config:
      ca_file: /certs/rootCA.pem
    static_configs:
      - targets: ['host.docker.internal:8085']
    relabel_configs:
