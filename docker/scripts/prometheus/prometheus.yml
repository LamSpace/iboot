global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    replica: 'iboot-prometheus'
    cluster: 'iboot-local'

rule_files:
  - "alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 后端服务：宿主机进程与容器部署都会发布这些端口，统一经宿主网关抓取。
  # 保留既有 job 名，使告警规则与看板查询不随采集方式变化。
  - job_name: 'iboot-system'
    metrics_path: '/actuator/prometheus'
    scheme: https
    tls_config:
      ca_file: /certs/rootCA.pem
    static_configs:
      - targets: ['host.docker.internal:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'iboot-system:8080'

  - job_name: 'iboot-ai'
    metrics_path: '/actuator/prometheus'
    scheme: https
    tls_config:
      ca_file: /certs/rootCA.pem
    static_configs:
      - targets: ['host.docker.internal:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'iboot-ai:8081'

  - job_name: 'iboot-file'
    metrics_path: '/actuator/prometheus'
    scheme: https
    tls_config:
      ca_file: /certs/rootCA.pem
    static_configs:
      - targets: ['host.docker.internal:8082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'iboot-file:8082'

  - job_name: 'iboot-auth'
    metrics_path: '/actuator/prometheus'
    scheme: https
    tls_config:
