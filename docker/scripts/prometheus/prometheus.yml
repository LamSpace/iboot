global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    replica: 'iboot-prometheus'
    cluster: 'iboot-local'

rule_files:
  - "alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'iboot-system'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 服务运行在同一个 compose 网络中，按服务名抓取
      - targets: ['iboot-system:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'iboot-system:8080'

  - job_name: 'iboot-ai'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['iboot-ai:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'iboot-ai:8081'

  - job_name: 'iboot-ops'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['iboot-ops:8089']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'iboot-ops:8089'

  - job_name: 'mysql-exporter'
    static_configs:
      - targets: ['mysql-exporter:9104']
    scrape_interval: 30s

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  - job_name: 'elasticsearch-exporter'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']
    scrape_interval: 30s