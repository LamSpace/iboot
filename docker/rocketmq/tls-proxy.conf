# RocketMQ TLS-only 前置代理。
#
# 只做协议识别与 TCP 透传：带 TLS ClientHello 的连接转发到 Proxy，非 TLS 连接
# 路由到本机关闭端口。TLS 仍在客户端与 Proxy 之间端到端完成，因此不影响 gRPC
# 的 ALPN/h2，也不引入“代理终止后最后一跳明文”的新边界。
events {
    worker_connections 1024;
}

stream {
    map $ssl_preread_protocol $rmq_backend {
        default "rocketmq-proxy:8081";
        ""      "127.0.0.1:9";
    }

    server {
        listen 8081;
        ssl_preread on;
        # 变量形式的 proxy_pass 需要解析器；127.0.0.11 是 Docker 内置 DNS。
        resolver 127.0.0.11 ipv6=off valid=10s;
        proxy_pass $rmq_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
    }
}
