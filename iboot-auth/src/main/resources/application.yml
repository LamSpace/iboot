server:
  port: 8083
  # 浏览器经门户 HTTPS 反代访问；信任 X-Forwarded-Proto，登录页与会话 Cookie 才按 HTTPS 生成
  forward-headers-strategy: ${IBOOT_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    context-path: /
    session:
      cookie:
        # 公开入口只提供 HTTPS；直接访问服务 HTTP 端口不作为浏览器登录入口
        secure: ${IBOOT_AUTH_COOKIE_SECURE:true}
  tomcat:
    threads:
      virtual:
        enabled: true
    max-connections: 10000

spring:
  application:
    name: iboot-auth
  # 注册中心与配置中心：走 spring.config.import，optional: 保证配置中心不可用时仍能启动
  config:
    import:
      - classpath:iboot-tls.yml
      - optional:nacos:iboot-auth.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:https://localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        enabled: ${IBOOT_NACOS_ENABLED:true}
        fail-fast: false
        # 服务实例以 HTTPS 暴露；网关的负载均衡据此选择 https
        secure: true
        metadata:
          secure: "true"
        # 实例地址使用服务名，证书 SAN 不依赖容器 IP；宿主机开发由 dev-init.sh 覆盖为 127.0.0.1
        ip: ${IBOOT_NACOS_DISCOVERY_IP:${spring.application.name}}
      config:
        server-addr: ${NACOS_SERVER_ADDR:https://localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        file-extension: yml
        enabled: ${IBOOT_NACOS_ENABLED:true}
  threads:
    virtual:
      enabled: true
  jmx:
    enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 过渡期直连管理端 schema：认证所需的用户、角色、菜单、参数与登录日志都归系统域，
      # 本服务不建自有 schema；退出条件见设计文档 D2。
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/iboot?${MYSQL_SSL_PARAMS:sslMode=VERIFY_IDENTITY&requireSSL=true&serverTimezone=UTC&characterEncoding=utf8}
      username: ${MYSQL_USERNAME:iboot_auth}
      password: ${MYSQL_PASSWORD:}
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:iboot_auth}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  # 授权码流程的服务端会话放在共享 Redis，保证多实例下回调可落在任意实例
  session:
    timeout: 30m
    redis:
      namespace: iboot:auth:session

# 鉴权：双栈期内仍接受旧的对称签名令牌，自包含令牌由认证服务公钥验签
jwt:
  secret: ${JWT_SECRET:iboot-admin-secret-key-for-jwt-token-generation-minimum-256-bits}
  expiration: 604800
  session-timeout: 30
  jwk-set-uri: ${JWT_JWK_SET_URI:https://localhost:8083/oauth2/jwks}
  legacy-enabled: ${JWT_LEGACY_ENABLED:false}

# 授权服务器：签发者地址必须等于浏览器访问授权服务器所用的公开来源。
# 宿主机开发默认是 Vite 的 HTTPS 地址；Docker 全量部署由 compose 覆盖为 https://localhost。
iboot:
  auth:
    server:
      issuer: ${IBOOT_AUTH_ISSUER:https://localhost:5173}
      client-id: ${IBOOT_AUTH_CLIENT_ID:iboot-portal}
      client-name: iBoot Portal
      redirect-uris:
        - ${IBOOT_AUTH_REDIRECT_URI:https://localhost:5173/callback}
      post-logout-redirect-uris:
        - ${IBOOT_AUTH_LOGOUT_REDIRECT_URI:https://localhost:5173/login}
      cli-client-id: ${IBOOT_AUTH_CLI_CLIENT_ID:iboot-cli}
      cli-client-name: iBoot CLI
      cli-redirect-uris:
        - ${IBOOT_AUTH_CLI_REDIRECT_URI:http://127.0.0.1:8765/callback}
      access-token-minutes: ${IBOOT_AUTH_ACCESS_TOKEN_MINUTES:30}
      refresh-token-minutes: ${IBOOT_AUTH_REFRESH_TOKEN_MINUTES:30}
      jwk-key-file: ${IBOOT_AUTH_JWK_FILE:}
      brand-name: ${IBOOT_BRAND_NAME:iBoot}
    # 个人访问令牌策略：有效期默认 30 天、上限 90 天，每用户最多 10 个活动令牌
    pat:
      default-days: ${IBOOT_AUTH_PAT_DEFAULT_DAYS:30}
      max-days: ${IBOOT_AUTH_PAT_MAX_DAYS:90}
      max-per-user: ${IBOOT_AUTH_PAT_MAX_PER_USER:10}
  security:
    service-authorization:
      extra-rules:
        - paths: ["/api/**"]
          callers: ["iboot-gateway"]
    whitelist:
      # 根路径只做一次到门户的重定向，没有业务含义
      - /
      # 认证相关：登录与注册必须匿名可达；登出自行解析令牌，过期令牌也应按成功处理
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/register
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /v3/api-docs
      - /v3/api-docs.yaml
      - /v3/api-docs/swagger-config
      - /swagger-resources/**
      - /webjars/**
      - /doc.html
      - /actuator/**
      - /error

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_1
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TEMPO_OTLP:https://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: ${IBOOT_TRACING_ENABLED:true}
    sampling:
      probability: ${IBOOT_TRACING_SAMPLE:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,threaddump,env,configprops,beans,caches,scheduledtasks,mappings
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: iboot-auth
      namespace: default
