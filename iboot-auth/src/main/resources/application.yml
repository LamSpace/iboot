server:
  port: 8083
  servlet:
    context-path: /
  tomcat:
    threads:
      virtual:
        enabled: true
    max-connections: 10000

spring:
  application:
    name: iboot-auth
  # 注册中心与配置中心：走 spring.config.import，optional: 保证配置中心不可用时仍能启动
  config:
    import: optional:nacos:iboot-auth.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${IBOOT_NACOS_ENABLED:true}
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
        enabled: ${IBOOT_NACOS_ENABLED:true}
  threads:
    virtual:
      enabled: true
  jmx:
    enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 过渡期直连管理端 schema：认证所需的用户、角色、菜单、参数与登录日志都归系统域，
      # 本服务不建自有 schema；退出条件见设计文档 D2。
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/iboot_admin?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
  # 授权码流程的服务端会话放在共享 Redis，保证多实例下回调可落在任意实例
  session:
    timeout: 30m
    redis:
      namespace: iboot:auth:session

# 鉴权：双栈期内仍接受旧的对称签名令牌，自包含令牌由认证服务公钥验签
jwt:
  secret: ${JWT_SECRET:iboot-admin-secret-key-for-jwt-token-generation-minimum-256-bits}
  expiration: 604800
  session-timeout: 30
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8083/oauth2/jwks}
  legacy-enabled: ${JWT_LEGACY_ENABLED:false}

# 授权服务器：签发者地址必须等于浏览器访问授权服务器所用的地址（开发期即网关地址）
iboot:
  auth:
    server:
      issuer: ${IBOOT_AUTH_ISSUER:http://localhost:8088}
      client-id: ${IBOOT_AUTH_CLIENT_ID:iboot-portal}
      client-name: iBoot Portal
      redirect-uris:
        - ${IBOOT_AUTH_REDIRECT_URI:http://localhost:5173/callback}
      post-logout-redirect-uris:
        - ${IBOOT_AUTH_LOGOUT_REDIRECT_URI:http://localhost:5173/login}
      access-token-minutes: ${IBOOT_AUTH_ACCESS_TOKEN_MINUTES:30}
      refresh-token-minutes: ${IBOOT_AUTH_REFRESH_TOKEN_MINUTES:30}
      jwk-key-file: ${IBOOT_AUTH_JWK_FILE:}
      brand-name: ${IBOOT_BRAND_NAME:iBoot}
  security:
    whitelist:
      # 根路径只做一次到门户的重定向，没有业务含义
      - /
      # 认证相关：登录与注册必须匿名可达；登出自行解析令牌，过期令牌也应按成功处理
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/register
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /v3/api-docs
      - /v3/api-docs.yaml
      - /v3/api-docs/swagger-config
      - /swagger-resources/**
      - /webjars/**
      - /doc.html
      - /actuator/**
      - /error

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_1
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TEMPO_OTLP:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: ${IBOOT_TRACING_ENABLED:true}
    sampling:
      probability: ${IBOOT_TRACING_SAMPLE:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
