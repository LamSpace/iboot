server:
  port: 8081
  tomcat:
    threads:
      virtual:
        enabled: true

spring:
  application:
    name: iboot-ai
  # 阶段 2：注册中心与配置中心。Nacos 3.x 不再支持 bootstrap.yml，统一走 spring.config.import；
  # optional: 前缀保证配置中心不可用时仍能以本地配置启动。
  config:
    import: optional:nacos:iboot-ai.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${IBOOT_NACOS_ENABLED:true}
        # 注册中心不可用时不阻断启动（默认 fail-fast 会直接让应用启动失败）
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
        enabled: ${IBOOT_NACOS_ENABLED:true}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
    elasticsearch:
      repositories:
        enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${IBOOT_AI_MYSQL_DATABASE:iboot_ai}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    clean-disabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  ai:
    openai:
      # 全局兜底：OpenAI starter 会同时装配 audio/image 模型，没有 Key 时启动失败
      api-key: ${DASHSCOPE_CHAT_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}/v1
      chat:
        api-key: ${DASHSCOPE_CHAT_API_KEY:}
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}/v1
        options:
          model: ${IBOOT_AI_CHAT_MODEL:qwen3.8-flash}
          temperature: 0.7
          max-tokens: 4096
          extra-body:
            enable_thinking: false
      embedding:
        api-key: ${DASHSCOPE_EMBEDDING_API_KEY:}
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}/v1
        options:
          model: ${IBOOT_AI_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: 1024

jwt:
  # 与 iboot-admin 共享同一密钥；生产环境必须通过环境变量注入
  secret: ${JWT_SECRET:iboot-admin-secret-key-for-jwt-token-generation-minimum-256-bits}
  session-timeout: 30

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TEMPO_OTLP:http://localhost:4318/v1/traces}
  # 指标继续走 Prometheus，避免与既有看板重复采集
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    enabled: ${IBOOT_TRACING_ENABLED:true}
    sampling:
      probability: ${IBOOT_TRACING_SAMPLE:0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: iboot-ai
      namespace: default

iboot:
  ai:
    quota:
      # 全局与单用户按自然日（北京时间）统计
      global-daily-tokens: ${IBOOT_AI_GLOBAL_DAILY_TOKENS:20000000}
      user-daily-tokens: ${IBOOT_AI_USER_DAILY_TOKENS:200000}
    chat:
      max-messages: 20
      conversation-ttl-hours: 24
      sse-timeout-ms: 300000
      heartbeat-ms: 20000
    permission:
      scope-url: ${IBOOT_AI_SCOPE_URL:http://localhost:8080/api/auth/scope}
      cache-seconds: ${IBOOT_AI_SCOPE_CACHE_SECONDS:60}
    agent:
      # 默认关闭；开启后 /api/ai/agent/** 才可用
      enabled: ${IBOOT_AI_AGENT_ENABLED:false}
      admin-base-url: ${IBOOT_AI_AGENT_ADMIN_BASE_URL:http://localhost:8080}
      max-steps: ${IBOOT_AI_AGENT_MAX_STEPS:6}
      step-timeout-seconds: ${IBOOT_AI_AGENT_STEP_TIMEOUT_SECONDS:30}
      max-result-chars: ${IBOOT_AI_AGENT_MAX_RESULT_CHARS:2000}
      max-result-rows: ${IBOOT_AI_AGENT_MAX_RESULT_ROWS:20}
      approval-ttl-seconds: ${IBOOT_AI_AGENT_APPROVAL_TTL_SECONDS:300}
    graph:
      # 默认关闭：关闭时不连接 Neo4j，也不注册图查询工具
      enabled: ${IBOOT_AI_GRAPH_ENABLED:false}
      uri: ${IBOOT_AI_GRAPH_URI:bolt://localhost:7687}
      username: ${IBOOT_AI_GRAPH_USERNAME:neo4j}
      password: ${IBOOT_AI_GRAPH_PASSWORD:}
      database: ${IBOOT_AI_GRAPH_DATABASE:neo4j}
      sync:
        page-size: ${IBOOT_AI_GRAPH_SYNC_PAGE_SIZE:200}
        max-pages: ${IBOOT_AI_GRAPH_SYNC_MAX_PAGES:50}
      query:
        max-rows: ${IBOOT_AI_GRAPH_QUERY_MAX_ROWS:50}
        timeout-seconds: ${IBOOT_AI_GRAPH_QUERY_TIMEOUT_SECONDS:10}
    rag:
      enabled: ${IBOOT_AI_RAG_ENABLED:true}
      index-name: ${IBOOT_AI_RAG_INDEX:iboot-kb-chunk-v1}
      top-k: ${IBOOT_AI_RAG_TOP_K:5}
      candidate-k: ${IBOOT_AI_RAG_CANDIDATE_K:20}
      num-candidates: ${IBOOT_AI_RAG_NUM_CANDIDATES:100}
      rank-constant: ${IBOOT_AI_RAG_RANK_CONSTANT:60}
      rank-window-size: ${IBOOT_AI_RAG_RANK_WINDOW_SIZE:50}
      max-chunks-per-doc: ${IBOOT_AI_RAG_MAX_CHUNKS_PER_DOC:2}
      chunk-max-chars: ${IBOOT_AI_RAG_CHUNK_MAX_CHARS:800}
      chunk-overlap-chars: ${IBOOT_AI_RAG_CHUNK_OVERLAP_CHARS:100}
      min-page-chars: ${IBOOT_AI_RAG_MIN_PAGE_CHARS:20}
      ingest:
        poll-interval-ms: ${IBOOT_AI_RAG_INGEST_POLL_INTERVAL_MS:5000}
        stale-minutes: ${IBOOT_AI_RAG_INGEST_STALE_MINUTES:15}
        max-attempts: ${IBOOT_AI_RAG_INGEST_MAX_ATTEMPTS:3}
      embedding:
        batch-size: ${IBOOT_AI_EMBEDDING_BATCH_SIZE:10}
        dimensions: ${IBOOT_AI_EMBEDDING_DIMENSIONS:1024}
        daily-token-limit: ${IBOOT_AI_EMBEDDING_DAILY_TOKENS:5000000}
      ocr:
        enabled: ${IBOOT_AI_OCR_ENABLED:false}
        model: ${IBOOT_AI_OCR_MODEL:qwen3.5-ocr}
        base-url: ${IBOOT_AI_OCR_BASE_URL:}
        api-key: ${DASHSCOPE_OCR_API_KEY:}
        dpi: ${IBOOT_AI_OCR_DPI:150}
        max-pages: ${IBOOT_AI_OCR_MAX_PAGES:50}
        daily-page-limit: ${IBOOT_AI_OCR_DAILY_PAGE_LIMIT:200}
        timeout-seconds: ${IBOOT_AI_OCR_TIMEOUT_SECONDS:60}
      storage:
        endpoint: ${IBOOT_AI_MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${IBOOT_AI_MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${IBOOT_AI_MINIO_SECRET_KEY:minioadmin}
        bucket: ${IBOOT_AI_MINIO_BUCKET:iboot-ai}
