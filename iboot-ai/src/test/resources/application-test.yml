spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  ai:
    openai:
      api-key: test-key
      base-url: http://localhost:1/v1
      chat:
        api-key: test-key
        base-url: http://localhost:1/v1
      embedding:
        api-key: test-key
        base-url: http://localhost:1/v1

jwt:
  secret: iboot-admin-secret-key-for-jwt-token-generation-minimum-256-bits
  session-timeout: 30
  # 集成测试用对称密钥签发令牌，不经过授权服务器；仅测试环境开启旧格式兼容
  legacy-enabled: true

iboot:
  ai:
    rag:
      enabled: false
