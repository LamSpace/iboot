spring:
  cloud:
    gateway:
      server:
        webflux:
          # 路由按「具体前缀优先」排列：SSE → AI → 管理端兜底。
          # 每拆出一个服务，就在 admin 兜底之前插入更具体的前缀。
          routes:
            # 服务端推送：长连接不能被响应超时截断，查询参数中的凭证需原样透传
            - id: admin-sse
              uri: ${IBOOT_ADMIN_URI:http://localhost:8080}
              order: 0
              predicates:
                - Path=/api/push/**
              metadata:
                response-timeout: -1
                connect-timeout: 2000

            - id: ai
              uri: ${IBOOT_AI_URI:http://localhost:8081}
              order: 10
              predicates:
                - Path=/api/ai/**

            - id: file
              uri: ${IBOOT_FILE_URI:http://localhost:8082}
              order: 20
              predicates:
                - Path=/api/file/**

            # 认证服务：旧的登录/登出/注册 + OAuth2/OIDC 标准端点与登录页。
            # GET /api/auth/scope 返回数据权限范围，属于系统域，仍由管理端承载，
            # 因此认证相关路径必须逐条列出而不是 /api/auth/**。
            - id: auth
              uri: ${IBOOT_AUTH_URI:http://localhost:8083}
              order: 30
              predicates:
                - Path=/api/auth/login,/api/auth/logout,/api/auth/register,/oauth2/**,/.well-known/**,/connect/**,/login
              filters:
                # 认证服务按请求 Host 拼登录页地址；保留原始 Host 才不会把内部端口暴露给浏览器
                - PreserveHostHeader

            - id: admin
              uri: ${IBOOT_ADMIN_URI:http://localhost:8080}
              order: 100
              predicates:
                - Path=/api/**
