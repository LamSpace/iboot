spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:https://localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        # 服务实例以 HTTPS 暴露；lb:// 负载均衡据此选择 https
        secure: true
        metadata:
          secure: "true"
        # 实例地址使用服务名，证书 SAN 不依赖容器 IP；宿主机开发由 dev-init.sh 覆盖为 127.0.0.1
        ip: ${IBOOT_NACOS_DISCOVERY_IP:${spring.application.name}}
    gateway:
      server:
        webflux:
          routes:
            - id: notify-sse
              uri: lb://iboot-notify
              order: 0
              predicates:
                - Path=/api/push/**
              metadata:
                response-timeout: -1
                connect-timeout: 2000

            - id: ai
              uri: lb://iboot-ai
              order: 10
              predicates:
                - Path=/api/ai/**

            - id: file
              uri: lb://iboot-file
              order: 20
              predicates:
                - Path=/api/file/**

            # 消息与通知：消息中心、公告、投递记录与内容检索
            - id: notify
              uri: lb://iboot-notify
              order: 25
              predicates:
                - Path=/api/message/**,/api/notice/**,/api/notification/**,/api/search

            # 审批工作流：请假审批全部接口
            - id: workflow
              uri: lb://iboot-workflow
              order: 26
              predicates:
                - Path=/api/approval/**

            # 监控与日志服务（日志、会话与资源检查按路径级登记，见 local profile 的说明）
            - id: monitor
              uri: lb://iboot-monitor
              order: 27
              predicates:
                - Path=/api/log/**,/api/online/**,/api/monitor/server/**,/api/monitor/redis/**,/api/monitor/silo/**

            # 调度服务：定时任务与数据备份（备份路径按路径级登记，见 local profile 的说明）
            - id: job
              uri: lb://iboot-job
              order: 28
              predicates:
                - Path=/api/monitor/backup/**,/api/job/**

            # 认证服务：旧登录接口 + OAuth2/OIDC 标准端点与登录页 + 个人访问令牌；
            # /api/auth/scope 由系统服务承载
            - id: auth
              uri: lb://iboot-auth
              order: 30
              predicates:
                - Path=/api/auth/login,/api/auth/logout,/api/auth/register,/api/auth/tokens/**,/oauth2/**,/.well-known/**,/connect/**,/login
              filters:
                # 认证服务按请求 Host 拼登录页地址；保留原始 Host 才不会把内部端口暴露给浏览器
                - PreserveHostHeader

            - id: system
              uri: lb://iboot-system
              order: 100
              predicates:
                - Path=/api/**
