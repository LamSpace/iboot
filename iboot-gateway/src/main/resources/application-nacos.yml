spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: admin-sse
              uri: lb://iboot-admin
              order: 0
              predicates:
                - Path=/api/push/**
              metadata:
                response-timeout: -1
                connect-timeout: 2000

            - id: ai
              uri: lb://iboot-ai
              order: 10
              predicates:
                - Path=/api/ai/**

            - id: file
              uri: lb://iboot-file
              order: 20
              predicates:
                - Path=/api/file/**

            # 认证服务：旧登录接口 + OAuth2/OIDC 标准端点与登录页；/api/auth/scope 仍由管理端承载
            - id: auth
              uri: lb://iboot-auth
              order: 30
              predicates:
                - Path=/api/auth/login,/api/auth/logout,/api/auth/register,/oauth2/**,/.well-known/**,/connect/**,/login
              filters:
                # 认证服务按请求 Host 拼登录页地址；保留原始 Host 才不会把内部端口暴露给浏览器
                - PreserveHostHeader

            - id: admin
              uri: lb://iboot-admin
              order: 100
              predicates:
                - Path=/api/**
