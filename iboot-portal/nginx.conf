# iBoot 前端项目 Nginx 配置
# 用于生产环境的静态资源服务

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # 基本设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # SSE 长连接超时设置为 1 小时
    keepalive_timeout 3600;
    types_hash_max_size 2048;

    # Gzip 压缩 (不压缩 SSE 流)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    # 不压缩 SSE 流
    gzip_proxied any no-cache no-store private auth;

    server {
        listen 80;
        server_name localhost;

        # 根目录指向构建后的静态文件
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # API 代理配置 (支持 SSE 推送)
        location /iboot/api {
            # 阶段 2：统一经网关入口转发；回滚时改回 http://iboot-admin:8080
            proxy_pass http://iboot-gateway:8088;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # SSE 推送支持 - 禁用代理缓冲
            proxy_buffering off;
            # 添加 Nginx X-Accel-Buffering 头部，禁用加速缓冲
            proxy_set_header X-Accel-Buffering no;

            # 超时设置 - SSE 长连接需要足够长的超时
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            # SSE 读取超时设置为 1 小时，与后端超时配置匹配
            proxy_read_timeout 3600s;

            # 重写路径，去掉 /iboot/api 前缀，只保留 /api
            rewrite ^/iboot/(.*)$ /$1 break;
        }

        # AI 服务：知识库、智能体与对话使用 /iboot/ai 前缀，转发到网关的 /api/ai
        location /iboot/ai {
            proxy_pass http://iboot-gateway:8088;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
            rewrite ^/iboot/ai(/.*)$ /api/ai$1 break;
        }

        # Druid 数据库监控：与系统服务同源，直接转发到系统服务。
        # 系统服务的 Spring Security 默认发送 X-Frame-Options: DENY，
        # 门户内的同源 iframe 需要改为 SAMEORIGIN 才能加载。
        location /druid {
            proxy_pass http://iboot-system:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options SAMEORIGIN always;
        }

        # Swagger UI 与 OpenAPI 文档：由系统服务提供
        location /swagger-ui.html {
            proxy_pass http://iboot-system:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options SAMEORIGIN always;
        }
        location /swagger-ui/ {
            proxy_pass http://iboot-system:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options SAMEORIGIN always;
        }
        location /v3/api-docs {
            proxy_pass http://iboot-system:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /swagger-resources/ {
            proxy_pass http://iboot-system:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /webjars/ {
            proxy_pass http://iboot-system:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /doc.html {
            proxy_pass http://iboot-system:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 运维控制台（Spring Boot Admin）：与开发环境的 Vite 代理保持一致，
        # 使门户内的同源 /sba 链接在容器部署下也可用。
        location /sba {
            proxy_pass http://iboot-ops:8089;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }

        # SBA 前端调用的实例/应用/Actuator 端点
        location /actuator {
            proxy_pass http://iboot-ops:8089;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /instances {
            proxy_pass http://iboot-ops:8089;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /applications {
            proxy_pass http://iboot-ops:8089;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}