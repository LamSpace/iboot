server:
  port: 8084
  servlet:
    context-path: /
  tomcat:
    threads:
      virtual:
        enabled: true
    max-connections: 10000

spring:
  application:
    name: iboot-notify
  # 注册中心与配置中心：走 spring.config.import，optional: 保证配置中心不可用时仍能启动
  config:
    import: optional:nacos:iboot-notify.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${IBOOT_NACOS_ENABLED:true}
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
        enabled: ${IBOOT_NACOS_ENABLED:true}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            data-id: iboot-notify-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
  threads:
    virtual:
      enabled: true
  jmx:
    enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 独立 schema：六张消息/公告/投递表归本服务所有，结构由本服务的 Flyway 管理
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/iboot?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
  # 迁移脚本只作用于本服务 schema；跨 schema 数据搬迁见 scripts/migrate/
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# 鉴权：与既有服务共用密钥与会话，令牌由认证服务签发
jwt:
  secret: ${JWT_SECRET:iboot-admin-secret-key-for-jwt-token-generation-minimum-256-bits}
  expiration: 604800
  session-timeout: 30
  legacy-enabled: false
  jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8083/oauth2/jwks}

iboot:
  # 操作审计：审计表归 iboot-monitor 所有，本服务跨 schema 写入，退出条件见 docs/23 §11.10
  logging:
    operate-log-table: sys_operate_log
  security:
    whitelist:
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /v3/api-docs
      - /v3/api-docs.yaml
      - /v3/api-docs/swagger-config
      - /swagger-resources/**
      - /webjars/**
      - /doc.html
      - /actuator/**
      - /error
      # 服务间内部端点：不经网关暴露，由共享密钥头鉴权
      - /internal/**
  notify:
    # 服务间通知登记端点的共享密钥；缺失时端点失败关闭
    internal-token: ${IBOOT_NOTIFY_INTERNAL_TOKEN:}
  # 多渠道通知：渠道启停与密钥，密钥不入仓，仅经环境变量注入
  notification:
    in-app-enabled: ${IBOOT_NOTIFICATION_IN_APP_ENABLED:true}
    email:
      enabled: ${IBOOT_NOTIFICATION_EMAIL_ENABLED:true}
      from: ${MAIL_FROM:}
    dingtalk:
      enabled: ${IBOOT_DINGTALK_ENABLED:false}
      webhook: ${IBOOT_DINGTALK_WEBHOOK:}
      secret: ${IBOOT_DINGTALK_SECRET:}
      keyword-prefix: "【iBoot】"
      rate-per-minute: ${IBOOT_DINGTALK_RATE_PER_MINUTE:20}
    sms:
      enabled: ${IBOOT_SMS_ENABLED:false}
      access-key-id: ${IBOOT_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${IBOOT_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${IBOOT_SMS_SIGN_NAME:}
      template-code: ${IBOOT_SMS_TEMPLATE_CODE:}
      region: ${IBOOT_SMS_REGION:cn-hangzhou}
    retry:
      max-attempts: ${IBOOT_NOTIFICATION_RETRY_MAX:5}
      backoff-seconds: ${IBOOT_NOTIFICATION_RETRY_BACKOFF_SECONDS:60}
      batch-size: ${IBOOT_NOTIFICATION_RETRY_BATCH_SIZE:100}
  # SSE 推送：长连接超时与跨实例广播
  push:
    enabled: true
    sse:
      timeout: 300000
      heartbeat-interval: 30000
      reconnect-interval: 5000
    notification:
      max-unread: 50
      batch-size: 20
    broadcaster: ${IBOOT_PUSH_BROADCASTER:local}
    redis:
      channel: iboot:push:events

mybatis:
  type-aliases-package: com.iboot.notify.infrastructure.persistence.po
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_1
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TEMPO_OTLP:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: ${IBOOT_TRACING_ENABLED:true}
    sampling:
      probability: ${IBOOT_TRACING_SAMPLE:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,threaddump,env,configprops,beans,caches,scheduledtasks,mappings
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.iboot.notify: DEBUG
