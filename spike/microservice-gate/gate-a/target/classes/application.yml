server:
  port: 18080

spring:
  application:
    name: spike-a
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
  config:
    import: optional:nacos:spike-a.yml

spike:
  sentinel:
    # 门禁验证用的 QPS 阈值，压测时按此判断是否被限流
    qps: 2

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TEMPO_OTLP:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,env
